<!doctype html><html lang="he" dir="rtl"><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f08a3c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="המטבח שלי">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<link rel="icon" href="icons/icon-192.png"></head><body><title>מטבח ששווה לשניים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: קיר מטבח אחד ישר שרץ לרוחב. חמש תחנות זו ליד זו (מקרר, שולחן עבודה, כיריים, דלפק הוצאה, משרד), גוללים ביניהן, ופס תחנות בתחתית. */
:root{
  --tile:#f6ecd9; --tile2:#dbe9f0; --grout:#eadfca; --steel:#c7cfd6; --steel2:#aeb8c1; --steeld:#8d98a3; --wood:#c98f57; --wood2:#a9713f;
  --floor:#e8dfd0; --floor2:#ddd2c0; --mint:#d3f1df; --mintd:#1d6b45; --org:#f08a3c; --orgd:#c76a22; --grn:#35c977; --red:#e5674f;
  --ink:#24303a; --mut:#5f6b75; --paper:#fffaf0;
  --sh:#f4f6f7; --sh2:#fff; --shl:#d9dfe3; --shi:#1f2a33; --shm:#66717b; --ok:#16834f; --no:#c2392a;
  --ui:'Rubik','Assistant',system-ui,sans-serif; --sans:'Assistant',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--tile);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4;direction:rtl;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--org);outline-offset:2px}
.app{position:relative;height:100%;display:flex;flex-direction:column}
/* top */
.top{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding-block:calc(10px + env(safe-area-inset-top,0px)) 6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.top>*{pointer-events:auto}
.brand{font-family:var(--ui);font-weight:800;font-size:16px;color:var(--ink);background:rgba(255,250,240,.85);padding:6px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 8px rgba(80,60,30,.12)}
.ichips{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;justify-content:flex-start;-webkit-mask-image:linear-gradient(to left,#000 82%,transparent);mask-image:linear-gradient(to left,#000 82%,transparent)}
.ichips button{flex:none;border:0;background:rgba(255,250,240,.85);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;color:var(--mut);cursor:pointer;box-shadow:0 2px 8px rgba(80,60,30,.1)}
.ichips button[aria-pressed="true"]{background:var(--ink);color:#fff}
.gear{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,250,240,.9);cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 8px rgba(80,60,30,.12)}
.gear svg{width:20px;height:20px}
.smp{position:absolute;z-index:6;bottom:auto;top:calc(44px + env(safe-area-inset-top,0px));right:22px;left:auto;transform:rotate(-1.5deg);border-radius:6px 6px 14px 14px!important;box-shadow:0 6px 16px rgba(60,40,20,.22);flex-direction:column;align-items:flex-start!important;max-width:170px;background:#fff3d6;color:#6b4800;border-radius:999px;padding:4px 6px 4px 12px;font-size:12.5px;font-weight:700;display:flex;gap:8px;align-items:center;white-space:nowrap;box-shadow:0 2px 8px rgba(80,60,30,.12)}
.smp button{border:0;background:#6b4800;color:#fff;border-radius:999px;padding:3px 10px;font-weight:800;cursor:pointer;font-size:12px}
/* wall */
.wall{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;background:var(--tile)}
.wall::-webkit-scrollbar{display:none}
.st{position:relative;flex:none;height:100%;aspect-ratio:400/760;scroll-snap-align:center;container-type:size}
.st>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0}
.o{position:absolute}
/* objects */
.screen{background:var(--mint);border-radius:5cqh;box-shadow:inset 0 0 0 .35cqh rgba(29,107,69,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--mintd);padding:1cqh;cursor:pointer;border:0;font-family:var(--ui)}
.screen small{font-size:2.1cqh;font-weight:700}
.screen b{white-space:nowrap;font-size:5.6cqh;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.screen span{font-size:1.65cqh;font-weight:600;opacity:.85;line-height:1.25}
.screen.bad{background:#fde3dc;color:#a8321f}
.screen.miss b{font-size:3.2cqh}
.dial{border-radius:50%;border:0;padding:0;cursor:grab;touch-action:none;background:radial-gradient(circle at 50% 42%,#fff 0,#eef1f3 55%,#cfd6dc 100%);box-shadow:0 .5cqh 1.2cqh rgba(40,50,60,.25),inset 0 0 0 .4cqh #b9c2ca;display:grid;place-items:center;font-family:var(--ui)}
.dial:active{cursor:grabbing}
.dial b{font-size:2.5cqh;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.dial svg{position:absolute;inset:-8%;width:116%;height:116%;pointer-events:none}
.pm{border:0;border-radius:50%;background:#fff;box-shadow:0 .3cqh .8cqh rgba(40,50,60,.2);font:800 2.8cqh var(--ui);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.lamp{border-radius:50%;background:#9aa4ad;box-shadow:inset 0 -.3cqh .6cqh rgba(0,0,0,.25)}
.lamp.on{background:var(--grn);box-shadow:0 0 1.6cqh var(--grn),inset 0 -.3cqh .6cqh rgba(0,0,0,.15)}
.lamp.no{background:var(--red);box-shadow:0 0 1.2cqh var(--red)}
.lampt{font:800 1.6cqh/1.2 var(--ui);color:var(--mintd);text-align:center}
.lampt.no{color:#a8321f}
.note{background:var(--paper);box-shadow:0 .5cqh 1cqh rgba(80,60,30,.18);border:0;padding:1.2cqh 1.1cqh;font:600 1.75cqh/1.3 var(--sans);color:var(--ink);text-align:right;cursor:pointer;transform:rotate(-2deg);display:flex;flex-direction:column;gap:.3cqh}
.note b{font:800 2cqh var(--ui)}
.note .pin{position:absolute;top:-.8cqh;left:50%;width:1.6cqh;height:1.6cqh;margin-left:-.8cqh;border-radius:50%;background:var(--org);box-shadow:0 .2cqh .4cqh rgba(0,0,0,.25)}
.note.g{color:var(--mintd)}.note.r{color:#a8321f}
.chipb{border:0;border-radius:999px;padding:1.1cqh 2cqh;font:800 2cqh var(--ui);cursor:pointer;display:inline-flex;align-items:center;gap:.8cqh;white-space:nowrap;box-shadow:0 .4cqh 1cqh rgba(80,60,30,.16);background:#fff;color:var(--ink)}
.chipb.p{background:var(--org);color:#fff}
.chipb:disabled{opacity:.45;cursor:default}
.mat{display:flex;gap:1.2cqh;justify-content:center;flex-wrap:wrap}
/* fridge shelves */
.shelf{display:flex;flex-direction:column;gap:.6cqh;overflow-y:auto;scrollbar-width:thin;padding:.4cqh}
.item{border:0;background:#fff;border-radius:1.2cqh;padding:.6cqh 1cqh;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:.8cqh;font:600 1.7cqh var(--sans);color:var(--ink);cursor:pointer;box-shadow:0 .2cqh .5cqh rgba(40,60,80,.12);text-align:right}
.item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.item b{text-align:left;font:800 1.6cqh var(--ui);white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--mintd)}
.item b.no{color:#a8321f}
.pant .item{background:#fffaf0;flex-direction:column;align-items:stretch;gap:.1cqh}
.pant .item b{text-align:left}
.inlab{font:800 1.8cqh var(--ui);color:var(--mut);text-align:center}
/* table */
.dcards{display:flex;gap:1cqh;overflow-x:auto;scrollbar-width:none;padding:.6cqh .4cqh 1cqh}
.card{flex:none;width:15cqh;min-height:8.5cqh;border:0;background:var(--paper);border-radius:1cqh;padding:1cqh;font:700 1.7cqh/1.25 var(--sans);color:var(--ink);text-align:right;cursor:pointer;box-shadow:0 .4cqh .9cqh rgba(80,60,30,.16);display:flex;flex-direction:column;justify-content:space-between;gap:.6cqh}
.card[aria-pressed="true"]{outline:.4cqh solid var(--org)}
.card small{font:800 1.7cqh var(--ui);color:var(--mintd)}
.board{display:flex;flex-wrap:wrap;gap:.8cqh;justify-content:center;align-content:center;padding:1cqh}
.tok{background:#fff;border-radius:999px;padding:.6cqh 1.2cqh;font:700 1.6cqh var(--sans);box-shadow:0 .2cqh .5cqh rgba(80,60,30,.15);white-space:nowrap}
.tok i{font-style:normal;color:var(--mut);font-weight:600}
/* pass */
.boxes{display:flex;flex-wrap:wrap;gap:1.2cqh;justify-content:center;align-items:flex-end}
.box{position:relative;border:0;width:15cqh;height:11cqh;border-radius:1.4cqh 1.4cqh .8cqh .8cqh;background:linear-gradient(#3d4852,#2b343c);color:#fff;cursor:pointer;box-shadow:0 .5cqh 1cqh rgba(0,0,0,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1cqh .6cqh .6cqh;gap:.4cqh}
.box::before{content:"";position:absolute;top:0;left:0;right:0;height:2.2cqh;border-radius:1.4cqh 1.4cqh 0 0;background:#4c5862}
.box .lbl{position:relative;background:#fff;color:var(--ink);border-radius:.6cqh;padding:.3cqh .8cqh;font:700 1.55cqh var(--sans);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.box .dot{position:relative;width:1.3cqh;height:1.3cqh;border-radius:50%;background:#9aa4ad}
.box .dot.ok{background:var(--grn);box-shadow:0 0 .8cqh var(--grn)}.box .dot.sent{background:#f2b705}
.box[aria-pressed="true"]{outline:.45cqh solid var(--org);outline-offset:.3cqh}
.box.add{background:none;border:.3cqh dashed var(--steeld);color:var(--mut);box-shadow:none;font:800 2cqh var(--ui)}
.box.add::before{display:none}
.ticket{background:var(--paper);border:0;border-radius:.6cqh;padding:.9cqh 1.2cqh;font-size:max(12.5px,1.55cqh)!important;box-shadow:0 .4cqh 1cqh rgba(80,60,30,.18);font:600 max(12.5px,1.7cqh)/1.35 var(--sans);color:var(--ink);text-align:right;cursor:pointer;display:flex;flex-direction:column;gap:.4cqh}
.ticket b{font:800 2.3cqh var(--ui)}
.ticket .row2{display:flex;justify-content:space-between;gap:1cqh}
.ticket .row2 strong{font-family:var(--ui);font-variant-numeric:tabular-nums}
/* office */
.wb{background:#fff;border-radius:1cqh;box-shadow:inset 0 0 0 .5cqh #c9d1d8,0 .4cqh 1cqh rgba(40,50,60,.15);padding:2cqh 2cqh 1.4cqh;font:600 1.75cqh/1.4 var(--sans);color:#2a4a7a;display:flex;flex-direction:column;gap:.4cqh;cursor:pointer;border:0;text-align:right}
.wb b{font:800 2.2cqh var(--ui);color:#1d3557}
.wb .l{display:flex;justify-content:space-between;gap:1cqh}
.binder{background:#fff;border:0;border-radius:.8cqh;box-shadow:0 .5cqh 1.2cqh rgba(40,50,60,.2);padding:1.6cqh 1.6cqh 1.2cqh 3.2cqh;font:600 1.65cqh/1.4 var(--sans);color:var(--ink);text-align:right;cursor:pointer;display:flex;flex-direction:column;gap:.5cqh;background-image:linear-gradient(90deg,transparent calc(100% - 2.2cqh),#e9eef2 calc(100% - 2.2cqh))}
.binder b{font:800 2.1cqh var(--ui)}
.binder .l{display:flex;justify-content:space-between;gap:1cqh}
.binder .l strong{font-family:var(--ui);font-variant-numeric:tabular-nums}
.binder .g{color:var(--ok)}.binder .r{color:var(--no)}
/* nav */
.nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#fffaf0;border-top:1px solid #eadfca;padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));box-shadow:0 -4px 16px rgba(80,60,30,.08)}
.nav button{border:0;background:none;border-radius:16px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;font:700 clamp(10.5px,3.1vw,12.5px) var(--ui);color:var(--mut);cursor:pointer;min-height:56px;justify-content:center}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="true"]{background:var(--org);color:#fff}
.whint{position:absolute;z-index:4;bottom:calc(84px + env(safe-area-inset-bottom,0px) + 10vh);border:0;background:rgba(255,250,240,.9);border-radius:999px;padding:8px 10px;font:700 13px var(--ui);color:var(--mut);cursor:pointer;box-shadow:0 2px 8px rgba(80,60,30,.15);display:flex;align-items:center;gap:4px}
.whint.r{right:max(6px,env(safe-area-inset-right,0px))}.whint.l{left:max(6px,env(safe-area-inset-left,0px))}
/* animations */
@keyframes steam{0%{transform:translateY(8px) scaleX(.9);opacity:0}30%{opacity:.75}100%{transform:translateY(-40px) scaleX(1.15);opacity:0}}
.steam path{animation:steam 3.2s ease-out infinite;transform-box:fill-box;transform-origin:center bottom}
.steam path:nth-child(2){animation-delay:1.1s}.steam path:nth-child(3){animation-delay:2.1s}
@keyframes flick{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.82)}}
.flame{animation:flick .5s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
.flame:nth-of-type(2n){animation-duration:.63s}
@media (prefers-reduced-motion:reduce){.steam path,.flame{animation:none}.steam path{opacity:.5}}
/* onboarding */
.onb{position:fixed;z-index:30;inset:0;display:grid;place-items:center;padding:16px;background:rgba(36,48,58,.35);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.onb .cardx{width:min(460px,100%);background:#fffaf0;border-radius:26px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(40,30,10,.25)}
.onb h1{font:800 26px var(--ui);margin:0}
.onb p{margin:0;color:#4a545e}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li button{width:100%;display:flex;align-items:center;gap:12px;text-align:start;background:#fff;border:1px solid #eadfca;border-radius:16px;padding:11px 14px;cursor:pointer;color:var(--ink)}
.steps li button i{font-style:normal;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#fbe8d6;color:var(--orgd);font-weight:800;flex:none}
.steps li.done button i{background:var(--ok);color:#fff}
.steps b{display:block;font-family:var(--ui)}.steps small{color:var(--mut)}
.lnk{border:0;background:none;color:var(--ink);text-decoration:underline;text-underline-offset:4px;cursor:pointer;font-weight:700;padding:6px 0;align-self:center}
/* sheet */
.mask{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45)}
.sheet{position:fixed;z-index:21;top:0;bottom:0;left:0;width:min(580px,100%);background:var(--sh);color:var(--shi);display:flex;flex-direction:column;color-scheme:light;box-shadow:24px 0 70px rgba(0,0,0,.45)}
.sh-top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 8px}
.sh-top b{flex:1;font-family:var(--serif);font-size:22px}
.x{width:42px;height:42px;border-radius:50%;border:0;background:#dfe4e8;font-size:22px;cursor:pointer;color:var(--shi)}
.tabs{display:flex;gap:4px;margin:0 18px;padding:4px;background:#dfe4e8;border-radius:14px;overflow-x:auto;scrollbar-width:none;flex:none}
.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:9px 10px;font-weight:700;color:var(--shm);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:#fff;color:var(--shi);box-shadow:0 1px 3px rgba(20,30,40,.14)}
.body{flex:1;overflow:auto;padding:16px 18px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.grp{background:#fff;border:1px solid var(--shl);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.grp h3{margin:0;font-size:14px;font-weight:800}
.hint{font-size:13px;color:var(--shm);margin:0}
.f{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #e6eaee;padding-bottom:8px;min-height:44px}
.f:last-child{border-bottom:0;padding-bottom:0}
.f label{font-weight:600;font-size:15px}
.f label small{display:block;font-weight:400;color:var(--shm);font-size:12.5px}
.f input,.f select{width:120px;flex:none;background:#f6f8f9;border:1px solid var(--shl);border-radius:10px;padding:8px 10px;font-size:16px;font-weight:700;text-align:left;font-variant-numeric:tabular-nums}
.f input[type=text],.f input[type=tel]{width:190px;text-align:right;font-weight:600}
.f input:focus,.f select:focus,.row input:focus,.row select:focus{outline:none;border-color:var(--ok);box-shadow:0 0 0 3px rgba(19,128,78,.15);background:#fff}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g4 label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--shm)}
.g4 input{background:#f6f8f9;border:1px solid var(--shl);border-radius:10px;padding:8px;font-size:16px;font-weight:700;text-align:center;width:100%;min-width:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) 92px 96px 36px;gap:6px;align-items:center}
.row.ing{grid-template-columns:1fr 1fr 1fr 36px}
.row.ing>:first-child{grid-column:1/-1}
.row.ing.rh>:first-child{grid-column:auto}
.row.ing.rh{grid-template-columns:1fr 1fr 1fr 36px}
.row.ing{padding-bottom:8px;border-bottom:1px solid #e6eaee}
.row input,.row select{background:#f6f8f9;border:1px solid var(--shl);border-radius:10px;padding:8px;font-size:15px;width:100%;min-width:0}
.row input[type=number]{text-align:left;font-weight:700;font-variant-numeric:tabular-nums}
.row .del{width:36px;height:36px;border:0;background:none;color:var(--shm);font-size:20px;cursor:pointer;border-radius:8px}
.row .del:hover{color:var(--no);background:#fbe9e6}
.rh{font-size:12px;color:var(--shm);font-weight:700}
.addb{border:1.5px dashed #b9c2c9;background:none;border-radius:12px;min-height:44px;font-weight:800;color:var(--ok);cursor:pointer}
.dish{border:1px solid var(--shl);border-radius:14px;overflow:hidden}
.dish>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;font-weight:700}
.dish>summary::-webkit-details-marker{display:none}
.dish>summary span{color:var(--shm);font-weight:700;font-variant-numeric:tabular-nums}
.dish[open]>summary{border-bottom:1px dashed var(--shl)}
.dish .in{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.dish .nm{background:#f6f8f9;border:1px solid var(--shl);border-radius:10px;padding:8px 10px;font-size:16px;font-weight:700;width:100%}
.lnkr{border:0;background:none;color:var(--no);font-weight:700;cursor:pointer;align-self:flex-start;padding:6px 0}
.menu{display:flex;flex-direction:column;gap:6px}
.menu label{display:flex;align-items:center;gap:10px;font-weight:600;min-height:40px}
.menu input{width:20px;height:20px;accent-color:var(--ok)}
.menu small{color:var(--shm);margin-inline-start:auto;font-variant-numeric:tabular-nums}
.split2{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:#e2e7eb}
.split2 i{display:block;height:100%}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.legend li{display:flex;align-items:center;gap:8px}
.legend li b{margin-inline-start:auto;font-variant-numeric:tabular-nums}
.legend .d{width:10px;height:10px;border-radius:3px;flex:none}
.kp{display:flex;align-items:baseline;gap:10px;border-top:1px solid #e6eaee;padding-top:8px;font-weight:800}

.onb .cardx{background:#fffaf0!important;border-radius:6px 6px 26px 26px!important;box-shadow:0 3px 0 #efe3cb,0 24px 60px rgba(60,40,20,.3)!important;position:relative;transform:rotate(-.6deg);padding:30px 22px 20px!important}
.onb .cardx::before{content:"";position:absolute;top:-9px;left:50%;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffb27a,#f08a3c 60%,#c76a22);box-shadow:0 3px 5px rgba(0,0,0,.25)}
.onb h1{font:700 40px/1 'Amatic SC',var(--sans)!important;color:#24303a}
.onb p{font:500 15.5px/1.5 var(--sans)!important;color:#5a4b38!important}
.steps li button{border-radius:18px!important;border:0!important;box-shadow:0 1px 3px rgba(80,60,30,.15),inset 0 -3px 0 #f0e6d4!important;padding:12px 14px!important}
.steps li button i{background:#fde7d3!important;color:#c76a22!important;font:800 15px var(--ui)!important}
.steps li.done button i{background:#35c977!important;color:#fff!important}
.steps b{font:700 22px/1 'Amatic SC',var(--sans)!important}
.onb .lnk{font:700 15px var(--ui)!important;color:#c76a22!important}
.onbl{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1.5px dashed #eadfca;padding-top:10px}
.onbl .lnk{font:600 13.5px var(--ui)!important;color:#8a7558!important;background:none;border:0;padding:6px 2px;cursor:pointer}
.smp #keepSample{background:#fffaf0;color:#6b4800;border:1.5px dashed #d9b46a;border-radius:6px;font:700 12px var(--ui);padding:4px 10px;margin-top:6px;box-shadow:0 3px 8px rgba(60,40,20,.18);cursor:pointer}
.sheet .miss.smpw{background:#fff3d6!important;color:#6b4800!important;border-color:#d9b46a!important;margin-bottom:10px;transform:rotate(-.4deg)}
.bkline{font:600 13px var(--sans);color:#8a7558;margin:4px 0 0}
.bkline.old{color:#b4532a}
.bkf{display:flex;align-items:center;justify-content:center;cursor:pointer;margin:8px 0}
/* toast = paper note */
.toast{background:#fffaf0!important;color:#2b3640!important;border-radius:6px 6px 16px 16px!important;box-shadow:0 2px 0 #efe3cb,0 12px 30px rgba(60,40,20,.25)!important;font:700 15px var(--sans)!important;padding:14px 18px 12px!important}
.toast::before{content:"";position:absolute;top:-6px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#f08a3c;box-shadow:0 2px 3px rgba(0,0,0,.2)}
/* wall chrome */
.chipb{font:700 max(14px,1.9cqh) var(--ui)!important;padding:1.15cqh 2.2cqh!important;box-shadow:0 .3cqh 0 #e6dccb,0 .6cqh 1.4cqh rgba(80,60,30,.18)!important}
.chipb.p{box-shadow:0 .3cqh 0 #c76a22,0 .6cqh 1.4cqh rgba(240,138,60,.35)!important}
.chipb:active{transform:translateY(.2cqh);box-shadow:0 .1cqh 0 #e6dccb!important}
.brand{font:700 24px/1 'Amatic SC',var(--sans)!important;padding:5px 14px 3px!important}
.ichips button{font:700 14px var(--ui)!important;padding:7px 13px!important}
.ichips button[aria-pressed="true"]{background:#f08a3c!important;color:#fff!important}
.gear{background:radial-gradient(circle at 40% 35%,#fff,#e6ebef 70%,#c9d1d8)!important}
.whint{font:700 13px var(--ui)!important;background:rgba(255,250,240,.88)!important}

.sheet .btn{border:0;min-height:50px;padding:10px 16px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;width:100%}
.sheet .acts{display:grid;gap:10px}
.sheet .stp input{width:82px!important}
@media (max-width:380px){.sheet .stp input{width:64px!important}}

.dchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.dchips button{flex:none;border:0;background:#fff;border-radius:16px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;font:700 14px var(--ui);color:#5a4b38;box-shadow:0 1px 3px rgba(80,60,30,.15);cursor:pointer}
.dchips button small{font:600 12px var(--ui);color:#9a8a75}
.dchips button[aria-pressed="true"]{background:#1d3f8a;color:#fff}.dchips button[aria-pressed="true"] small{color:#cfe0ff}

/* review round 2 */
.sheet input[type=number]{-moz-appearance:textfield;appearance:textfield}
.sheet input[type=number]::-webkit-inner-spin-button,.sheet input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.sheet .tabs{-webkit-mask-image:linear-gradient(to left,transparent,#000 26px,#000 calc(100% - 6px),transparent);mask-image:linear-gradient(to left,transparent,#000 26px,#000 calc(100% - 6px),transparent)}
.sheet .nextb{width:100%;margin-top:14px;background:#f08a3c!important;color:#fff!important;font:800 16px var(--ui)!important;border:0;border-radius:18px;padding:14px;box-shadow:0 4px 14px rgba(240,138,60,.35);cursor:pointer}
details.more{border-radius:16px;background:#fffaf0;padding:2px 12px}
details.more>summary{cursor:pointer;font:700 14px var(--ui);color:#7a6a55;padding:10px 0;list-style:none}
details.more>summary::before{content:"+ "}
details.more[open]>summary::before{content:"− "}
.t-month .tw{padding-inline-start:14px}
.stamp{border:2px dashed #c9b98f;background:none;border-radius:10px;padding:8px 12px;min-height:40px;font:700 13.5px var(--ui);color:#7a6a55;cursor:pointer;white-space:nowrap}
.stamp.on{border:2px solid #1d6b45;color:#1d6b45;transform:rotate(-4deg);background:#eaf6ef}
.ticket-sum{font:700 15px var(--sans);color:#3a4048;line-height:1.6}
.ticket-sum .tot{font:700 30px 'Amatic SC',var(--sans);color:#1d6b45;display:block;margin-top:4px}
.ticket-sum .tot.r{color:#b2321f}
@media (min-width:900px){#nav,.nav{max-width:560px;margin-inline:auto;border-radius:22px 22px 0 0}
 .st{-webkit-mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);margin-inline:-11px}}
.t-month .kc b.nf{font:700 22px 'Amatic SC',var(--sans)!important;color:#9a8f80!important}
.tag i.un{font:600 max(11px,1.1cqh) var(--sans);font-style:normal;color:#6b7680;white-space:nowrap}
.tag b{direction:ltr}

/* round 3 */
.ichips{overflow:visible!important;-webkit-mask-image:none!important;mask-image:none!important;position:relative;justify-content:flex-start}
.isw{display:flex;align-items:center;gap:6px;border:0;background:#f08a3c;color:#fff;border-radius:999px;padding:7px 14px;font:700 14px var(--ui);box-shadow:0 3px 10px rgba(240,138,60,.35);cursor:pointer;max-width:100%}
.isw span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.isw i{font-style:normal;font-size:11px;opacity:.9}
.ipop{position:absolute;top:calc(100% + 8px);right:0;z-index:30;background:#fffaf0;border-radius:6px 6px 18px 18px;box-shadow:0 2px 0 #efe3cb,0 14px 34px rgba(60,40,20,.28);padding:8px;display:flex;flex-direction:column;gap:2px;min-width:200px;transform:rotate(-.6deg)}
.ipop::before{content:"";position:absolute;top:-6px;right:24px;width:12px;height:12px;border-radius:50%;background:#f08a3c;box-shadow:0 2px 3px rgba(0,0,0,.2)}
.ipop button{display:flex;align-items:center;gap:8px;border:0;background:none;text-align:right;padding:10px 10px;border-radius:12px;font:700 15px var(--sans);color:#2b3640;cursor:pointer}
.ipop button[aria-pressed="true"]{background:#fde9d8}
.ipop button[data-new]{color:#c76a22;border-top:1px dashed #eadfca;border-radius:0 0 12px 12px}
.ipop .d{width:9px;height:9px;border-radius:50%;background:#c9b98f}.ipop .d.ok{background:#1d9a5c}.ipop .d.sent{background:#f0a23c}
.sheet .row.ing.stag{display:grid!important;grid-template-columns:1fr 34px!important;grid-template-areas:"nm del" "pr pr" "ft ft" "sp sp";gap:6px 8px!important;padding:12px 14px 10px!important;border-radius:6px 6px 14px 14px!important;position:relative}
.sheet .row.ing.stag::before{content:"";position:absolute;top:-1px;right:18px;width:10px;height:10px;border-radius:50%;background:#e7edf1;box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.sheet .row.ing.stag>input[data-k=name]{grid-area:nm;border:0!important;background:none!important;font:700 26px/1.1 'Amatic SC',var(--sans)!important;padding:4px 2px!important;color:#24303a}
.stag>.del{grid-area:del}
.stag .pr{grid-area:pr;display:flex;align-items:baseline;gap:4px;border-bottom:2px dashed #e3e9ee;padding-bottom:6px}
.stag .pr span{font:800 22px var(--ui);color:#1d6b45}
.stag .pr input{border:0!important;background:none!important;font:800 34px/1 var(--ui)!important;color:#1d6b45!important;width:6.5ch!important;padding:0!important;text-align:right!important;direction:ltr}
.stag .pr select{border:0!important;background:none!important;font:700 16px var(--sans)!important;color:#6b7680!important;padding:0 4px!important;width:auto!important}
.stag .ft{grid-area:ft;display:flex;justify-content:space-between;align-items:center;gap:8px}
.stag .plc{display:flex;background:#f3eadb;border-radius:999px;padding:3px}
.stag .plc button{border:0;background:none;border-radius:999px;padding:5px 12px;font:700 13px var(--ui);color:#7a6a55;cursor:pointer}
.stag .plc button[aria-pressed="true"]{background:#fff;color:#2b3640;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.stag .ws{display:flex;align-items:center;gap:4px;font:700 13px var(--sans);color:#7a6a55}
.stag .ws input{width:52px!important;padding:5px 6px!important;text-align:center!important;font:700 14px var(--ui)!important}
.t-ings .grp{display:flex;flex-direction:column;gap:12px}
details.ages{margin:-2px 0 4px;font:600 13px var(--sans);color:#7a6a55}
details.ages>summary{cursor:pointer;list-style:none;padding:2px 4px;color:#c76a22;font-weight:700}
details.ages>summary::before{content:"⌄ "}
details.ages .ag{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 4px}
details.ages label{display:flex;flex-direction:column;gap:2px;font:700 12px var(--ui);color:#7a6a55}
details.ages input{background:#fffaf0;border:1.5px solid #eadfca;border-radius:10px;padding:6px 8px;font:700 14px var(--ui);width:100%;min-width:0;text-align:center}
details.ages small{color:#9a8f80;font-size:12px}
.ripple{margin-top:12px;background:#eaf6ef;border-radius:6px 6px 16px 16px;padding:10px 12px;font:600 14px/1.45 var(--sans);color:#1d4d35}
.ripple b{display:block;font:700 22px 'Amatic SC',var(--sans);color:#1d6b45}
.ripple small{display:block;color:#4b6b5a;font-size:12.5px;margin-top:2px}
label.tg{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font:700 15px var(--sans);cursor:pointer}
label.tg input{width:20px;height:20px;accent-color:#f08a3c}
label.tg small{flex-basis:100%;font:500 13px var(--sans);color:#9a8f80}
.ichips .isw{background:#f08a3c!important;color:#fff!important;padding:7px 14px!important}
.ichips .ipop button{background:none!important;color:#2b3640!important;box-shadow:none!important;border-radius:12px!important;padding:10px!important;font:700 15px var(--sans)!important}
.ichips .ipop button[aria-pressed="true"]{background:#fde9d8!important}
.ichips .ipop button[data-new]{color:#c76a22!important}

/* events */
.evtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.evtabs button{flex:none;border:0;background:#f3eadb;border-radius:999px;padding:7px 14px;font:700 14px var(--ui);color:#7a6a55;cursor:pointer}
.evtabs button[aria-pressed="true"]{background:#2b3640;color:#fff}
.evres{background:#fffaf0!important;border-radius:6px 6px 22px 22px!important;box-shadow:0 2px 0 #efe3cb,0 10px 24px rgba(80,60,30,.12)!important;position:relative}
.evres::before{content:"";position:absolute;top:-6px;left:50%;width:56px;height:14px;margin-left:-28px;background:rgba(240,138,60,.55);transform:rotate(-2deg)}
.evk small{display:block;font:700 14px var(--ui);color:#7a6a55}
.evk b{display:block;font:700 52px/1 'Amatic SC',var(--sans);color:#2b3640;direction:ltr;text-align:right}
.evres.g .evk b{color:#1d6b45}.evres.r .evk b{color:#b2321f}
.evk span{font:600 13px var(--sans);color:#7a6a55}
.evl{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin:12px 0 4px;border-top:1px dashed #eadfca;padding-top:10px}
.evl span{display:flex;justify-content:space-between;font:600 14px var(--sans);color:#4b5560}
.evl strong{font:800 14px var(--ui);color:#2b3640}
.evres .btn{width:100%;margin-top:8px}
.emh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.emn{flex:1;border:0;background:none;font:700 30px/1.1 'Amatic SC',var(--sans);color:#24303a;padding:2px;min-width:0}
.emn:focus{outline:2px dashed #f0b88a;border-radius:8px}
.ecat{font:800 12px var(--ui);color:#c76a22;letter-spacing:.02em;margin:10px 2px 4px}
.eline{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(40,50,60,.12);margin-bottom:6px;overflow:hidden}
.eline.ms{box-shadow:inset 3px 0 0 #e8a08e,0 1px 3px rgba(40,50,60,.12)}
.eline.svc{background:#f6f8fa}
.eh{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;cursor:pointer;text-align:right}
.eh .nm{font:700 15px var(--sans);color:#2b3640;min-width:0}
.eh .nm em{font-style:normal;font:800 11.5px var(--ui);color:#c76a22;background:#fde9d8;border-radius:999px;padding:1px 7px;margin-inline-start:6px}
.eh .ct{display:flex;flex-direction:column;align-items:flex-end;font:800 14px var(--ui);color:#1d6b45;white-space:nowrap}
.eline.ms .eh .ct{color:#b2321f}
.eh .ct small{font:600 11.5px var(--sans);color:#9a8f80}
.eb{padding:4px 12px 12px;display:flex;flex-direction:column;gap:8px;border-top:1px dashed #eadfca}
.enm{border:1.5px solid #eadfca;background:#fffaf0;border-radius:12px;padding:8px 10px;font:700 16px var(--sans);width:100%}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:#f3eadb;border-radius:14px;padding:3px}
.seg button{flex:1 0 auto;border:0;background:none;border-radius:11px;padding:7px 8px;font:700 13px var(--ui);color:#7a6a55;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:#2b3640;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.ef{display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 14px var(--sans);color:#4b5560}
.ef input,.ef select{width:52%;border:1.5px solid #eadfca;background:#fffaf0;border-radius:12px;padding:8px 10px;font:700 15px var(--ui);min-width:0}
.erow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.erow .ef{flex-direction:column;align-items:stretch;gap:3px}.erow .ef input,.erow .ef select{width:100%}
.eh2{color:#9a8f80;font-size:12px}
.board .tl{display:flex;flex-direction:column;gap:3px;margin-bottom:8px;font:600 14px var(--sans);color:#2a4a8a}
.board h4,.grp h4{margin:12px 0 4px;font:700 22px 'Amatic SC',var(--sans);color:#1d3557}
.grp .l{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed #e9e2d4;font:600 14px var(--sans)}
.grp .l i{font-style:normal;font:700 11px var(--ui);color:#9a8f80}
.grp .l strong{font:800 14px var(--ui);white-space:nowrap}
.board{background:#fbfdff!important;box-shadow:inset 0 0 0 6px #e3e8ee,0 6px 18px rgba(40,60,80,.08)!important}
.evempty{display:flex;flex-direction:column;gap:12px}
#wb .c.ev b{color:#c76a22}
.eh .nm em.or{background:#e7eef6;color:#2a4a8a}
.eh{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 8px}
.ehb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:0;background:none;padding:4px 2px;cursor:pointer;text-align:right}
.ehb small{font:600 11.5px var(--sans);color:#9a8f80}
.eh .ct{font:800 14px var(--ui);color:#1d6b45;white-space:nowrap}
.eline.ms .eh .ct{color:#b2321f}
.qc{display:flex;align-items:center;gap:3px;flex:none;background:#fffaf0;border:1.5px solid #eadfca;border-radius:12px;padding:3px 6px}
.eline.ms .qc{border-color:#e8a08e;background:#fff5f2}
.qc span{font:800 14px var(--ui);color:#1d6b45}
.qc input{width:52px;border:0;background:none;font:800 16px var(--ui);color:#1d6b45;text-align:center;padding:4px 0;direction:ltr}
.qc input::placeholder{color:#d9a291}
.qc small{font:600 11px var(--sans);color:#9a8f80}
.evtabs{flex:none;min-height:44px;padding:4px 2px;align-items:center}
.evtabs button{min-height:36px}
.evres .prog{height:10px;border-radius:6px;background:#f3eadb;overflow:hidden;margin-top:6px}
.evres .prog i{display:block;height:100%;background:#f08a3c;border-radius:6px}
.eb{background:#fffdf6;background-image:repeating-linear-gradient(#fffdf6 0 31px,#eef2f6 31px 32px)}
.seg button[aria-pressed="true"]{background:#f08a3c!important;color:#fff!important}
.qc{min-height:44px}
.qc small{font-size:12px;color:#7a6a55}
.mg{display:flex;align-items:center;gap:8px;font:700 13px var(--sans);color:#7a6a55;margin:0 2px 6px}
.mg input{width:72px;border:1.5px solid #eadfca;background:#fffaf0;border-radius:10px;padding:5px 6px;font:700 14px var(--ui);text-align:center}
.mg small{color:#9a8f80;font-weight:600}

/* event: light */
.ecard{background:#fff;border-radius:6px 6px 22px 22px;box-shadow:0 2px 0 #efe3cb,0 10px 24px rgba(80,60,30,.1);padding:14px 14px 16px;display:flex;flex-direction:column;gap:8px;position:relative}
.ecard::before{content:"";position:absolute;top:-6px;left:50%;width:56px;height:14px;margin-left:-28px;background:rgba(240,138,60,.55);transform:rotate(-2deg)}
.ename{border:0;background:none;font:700 34px/1.05 'Amatic SC',var(--sans);color:#24303a;padding:2px;width:100%}
.ename:focus,.emn:focus{outline:2px dashed #f0b88a;border-radius:8px}
.ewhen{align-self:flex-start;border:0;background:#f3eadb;border-radius:999px;padding:5px 12px;font:700 13px var(--sans);color:#7a6a55;cursor:pointer}
.ewh{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ewh label{display:flex;flex-direction:column;gap:3px;font:700 12px var(--ui);color:#7a6a55}
.ewh input{border:1.5px solid #eadfca;background:#fffaf0;border-radius:12px;padding:8px;font:700 14px var(--sans);min-width:0}
.csts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.cst{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.cst small{font:700 12.5px var(--ui);color:#7a6a55}
.cs{display:flex;align-items:center;justify-content:space-between;width:100%;background:#fffaf0;border:1.5px solid #eadfca;border-radius:16px;padding:3px}
.cs button{width:30px;height:38px;border:0;background:none;font:700 20px var(--ui);color:#c76a22;cursor:pointer;flex:none;border-radius:12px}
.cs button:active{background:#fde9d8}
.cs label{display:flex;align-items:baseline;justify-content:center;min-width:0;flex:1;font:800 15px var(--ui);color:#1d6b45}
.cs input{width:100%;min-width:0;border:0;background:none;text-align:center;font:800 20px var(--ui);color:#24303a;padding:6px 0;direction:ltr;-moz-appearance:textfield;appearance:textfield}
.cs input::-webkit-inner-spin-button{-webkit-appearance:none}
.ekid{display:flex;align-items:center;gap:10px}.ekid .cst{width:34%}.ekid>small{color:#9a8f80;font-size:12px}
.ebd{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;border-top:1px dashed #eadfca;padding-top:8px}
.ebd span{display:flex;justify-content:space-between;font:600 13.5px var(--sans);color:#4b5560}.ebd strong{font:800 13.5px var(--ui);color:#2b3640}
.ebar{position:sticky;bottom:-22px;z-index:4;display:flex;align-items:center;gap:10px;background:#2b3640;color:#fff;border-radius:20px;padding:10px 12px 10px 10px;box-shadow:0 10px 26px rgba(30,30,40,.3);flex-wrap:wrap}
.ebar.g{background:#1d6b45}.ebar.r{background:#9c3424}
.eb1{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;border:0;background:none;color:inherit;text-align:right;padding:2px 4px;cursor:pointer}
.eb1 b{font:800 16px var(--ui)}.eb1 small{font:600 12px var(--sans);opacity:.8}
.eprog{flex-basis:100%;height:6px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}

  {id:uid(),name:'גני ילדים',contact:'',phone:'',price:13,cap:'',meals:{gan:140,el:0,mid:0,ad:0},sp:{n:0,price:'',extra:''},days:5,weeks:44,menu:ids.slice(),status:'ok',num:1002},
  {id:uid(),name:'מעון יום',contact:'',phone:'',price:16,cap:'',meals:{gan:0,el:0,mid:0,ad:60},sp:{n:0,price:'',extra:''},days:6,menu:[ids[0],ids[1]],status:'draft',num:1003}];

 const i=cur();if(!i){B.innerHTML=`<div class="evempty"><p class="hint">עוד אין מוסד להציע לו מחיר. מוסיפים מוסד, או מכינים הצעה לאירוע חד־פעמי.</p><button class="btn nextb" id="oi">+ מוסד ראשון ←</button><button class="addb" id="oe">+ הצעה לאירוע</button></div>${(S.events||[]).length?allOffersHTML():''}`;B.querySelector('#oi').onclick=()=>{closeSheet();newInst();};B.querySelector('#oe').onclick=()=>{tab='event';drawSheet();$('body').scrollTop=0;};return;}

function copy(t,msg){const done=()=>toast(msg);try{navigator.clipboard.writeText(t).then(done,()=>fallback(t,msg));}catch(e){fallback(t,msg);}}
