<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>גבי – תזכורות תשלום</title>
<style>
:root{--bg:#FBF8F1;--card:#fff;--ink:#0F172A;--muted:#64748B;--line:#e5e7eb;--brand:#10B981;
--brand-ink:#0F172A;--warn:#b45309;--warn-bg:#fef3c7;--bad:#b91c1c;--sms:#e7f6f3;--chip:#eef2f7}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#121a2b;--ink:#e5e7eb;--muted:#9aa4b2;
--line:#243049;--brand:#10B981;--brand-ink:#0F172A;--warn:#fbbf24;--warn-bg:#3a2a06;--bad:#f87171;
--sms:#10332e;--chip:#1b2540}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
font:15px/1.5 Heebo,Rubik,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
header{padding:16px;border-bottom:1px solid var(--line);background:var(--card);display:flex;
flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center}.logo{width:36px;height:36px;flex:none}
.logo .eye{fill:var(--ink)}
h1{font-size:18px;margin:0}.slogan{color:var(--muted);font-size:13px}
.dry{background:var(--warn-bg);color:var(--warn);padding:6px 10px;border-radius:999px;
font-size:13px;font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);
padding:8px 14px;border-radius:10px;cursor:pointer;min-height:40px}
button.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
button.ghost-bad{color:var(--bad)}button:disabled{opacity:.5;cursor:not-allowed}
main{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:16px;padding:16px;
max-width:1200px;margin:0 auto}
@media (max-width:760px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.list{display:flex;flex-direction:column;gap:8px}.item{text-align:right;width:100%;display:block}
.item.sel{outline:2px solid var(--brand)}
.qf{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.qf button{min-height:32px;padding:4px 10px;font-size:13px}
.qf button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
#qmore button,#dmore button{width:100%;margin-top:8px}.row{display:flex;justify-content:space-between;gap:8px}
.chip{background:var(--chip);border-radius:999px;padding:2px 8px;font-size:12px;color:var(--muted)}
.chip.pending{background:var(--warn-bg);color:var(--warn)}.chip.blocked{color:var(--bad)}
.previews{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1000px){.previews{grid-template-columns:1fr}}
h2{font-size:15px;margin:0 0 10px}.phone{border:1px solid var(--line);border-radius:22px;
padding:16px 12px;max-width:340px;background:var(--bg)}
.sender{text-align:center;color:var(--muted);font-size:12px;margin-bottom:10px}
.bubble{background:var(--sms);border-radius:16px 16px 4px 16px;padding:10px 12px;
white-space:pre-wrap;word-break:break-word}
.meta{color:var(--muted);font-size:12px;margin-top:8px}
.mail-head{font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px;
margin-bottom:8px;word-break:break-all}
iframe{width:100%;min-height:360px;border:1px solid var(--line);border-radius:10px;background:#fff}
.empty{color:var(--muted);padding:24px;text-align:center}.err{color:var(--bad);margin-top:8px}
.note{color:var(--warn);background:var(--warn-bg);padding:8px 12px;border-radius:8px;margin-top:8px}
.confirm{display:flex;gap:8px;align-items:flex-start;margin-top:12px;padding:10px 12px;border:1px solid var(--bad);border-radius:8px;cursor:pointer}
.decide{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#dash{max-width:1200px;margin:16px auto 0;padding:0 16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi .v{font-size:22px;font-weight:800}.kpi .l{color:var(--muted);font-size:13px}
.kpi.warn .v{color:var(--warn)}.tbl{overflow-x:auto}
button.resume{display:block;white-space:nowrap;min-height:32px;padding:4px 10px;font-size:13px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px}td.num{font-variant-numeric:tabular-nums}
tr.closed td{color:var(--muted);text-decoration:line-through}
.late{color:var(--bad);font-weight:600}
button.resume{margin-inline-start:6px;padding:4px 10px;min-height:32px;font-size:13px}
.loaderr{display:flex;flex-wrap:wrap;align-items:center;gap:12px;max-width:1168px;margin:16px auto 0;padding:0 16px;font-weight:600}
.loaderr[hidden]{display:none}.loaderr span{flex:1;min-width:200px}
.sk{display:block;height:14px;border-radius:6px;background:var(--chip);animation:sk 1.2s ease-in-out infinite}
.sk.w{width:60%}.sk.big{height:24px;width:50%;margin-bottom:8px}.skitem{display:grid;gap:10px}
@keyframes sk{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style>
</head>
<body>
<header>
  <div class="brand"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><path d="M22 13h12a4 4 0 0 1 4 4v20" fill="none" stroke="#10B981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 37l-11 9" fill="none" stroke="#10B981" stroke-width="7" stroke-linecap="round"/><path d="M14 50q18 12 36 0" fill="none" stroke="#10B981" stroke-width="5" stroke-linecap="round"/><circle class="eye" cx="48" cy="21" r="4.5"/></svg>
    <div><h1>גבי</h1><div class="slogan">גבי – תזכורות תשלום</div></div></div>
  <span class="dry">מצב בדיקה: אף הודעה לא נשלחת באמת</span>
  <div class="actions">
    <button id="btnSync">סנכרון חשבונית ירוקה</button>
    <button id="btnPlan">הכנת תזכורות</button>
    <button id="btnDispatch" class="primary">שליחה (בדיקה)</button>
  </div>
</header>
<div class="vh" id="busyMsg" role="status"></div>
<div class="err loaderr" id="loaderr" role="alert" hidden><span id="loadMsg">לא הצלחנו לטעון את הנתונים מהשרת. מה שמוצג כאן אולי לא עדכני.</span>
  <button id="btnRetry">נסו שוב</button></div>
<div class="note loaderr" id="wunk" role="alert" hidden><span id="wunkMsg"></span><button id="btnWunk">הבנתי</button></div>
<div class="err loaderr" id="acterr" role="alert" hidden><span id="actMsg"></span><button id="btnAct">הבנתי</button></div>
<div class="err loaderr" id="locked" role="alert" hidden><span id="lockMsg"></span><button id="btnLogin" class="primary">כניסה</button></div>
<div id="dash">
  <div class="kpis" id="kpis"></div>
  <section class="card"><div class="row"><h2>חובות פתוחים וסטטוס תזכורות</h2><span class="slogan" id="today"></span></div><div class="qf" id="df" role="group" aria-label="סינון החובות"></div>
    <div class="tbl"><table><thead><tr><th>לקוח</th><th>חשבונית</th><th>סכום</th><th>מועד</th><th>איחור</th>
    <th>תזכורות שנשלחו</th><th>סטטוס אחרון</th></tr></thead><tbody id="debts"></tbody></table></div><div id="dmore"></div></section>
</div>
<main>
  <section class="card"><h2>תור תזכורות</h2><div class="qf" id="qf" role="group" aria-label="סינון התור"></div><div id="list" class="list"></div><div id="qmore"></div></section>
  <section class="card" id="detail"><div class="empty">בחרו תזכורת כדי לראות תצוגה מקדימה של SMS ומייל</div></section>
</main>
<script>
const STATUS={pending_approval:"ממתינה לאישורך",approved:"מאושרת",sent_dry_run:"נשלחה (בדיקה)",
  rejected:"נדחתה",cancelled:"בוטלה",sending:"בשליחה",
  send_unknown:"השליחה נקטעה באמצע, אולי יצאה. לבדוק ביומן היוצאים"};
// critic סבב 52: סיבת השהיה = כוונת מנוע השיחה או סימון בעל העסק, אולי עם ':until=YYYY-MM-DD'.
// לפני כן הוצג קוד גולמי («promise:until=…», «deceased»). זהה ל-PAUSE_LABEL ב-/app/.
const PAUSE={paid_claim:"כתב/ה ששילם/ה. בדקו בחשבון ואז חדשו",promise:"הבטיח/ה לשלם",plan_request:"ביקש/ה פריסה",
  plan_accept:"הסכים/ה להצעת הפריסה",plan_reject:"דחה/תה את הצעת הפריסה",cant_pay:"כתב/ה שאין אפשרות לשלם כרגע",
  dispute:"יש מחלוקת על החשבונית",legal:"הוזכר עניין משפטי",distress:"נראה שהלקוח/ה במצוקה. כדאי לפנות אישית",
  callback:"ביקש/ה שתחזרו אליו/ה",wrong_person:"כתב/ה שזה לא המספר הנכון",abusive:"תגובה פוגענית. כדאי לטפל אישית",
  credit_review:"יש זיכוי שלא שויך לחשבונית. בדקו ואז חדשו",minor:"סימנתם: קטין/ה",deceased:"סימנתם: נפטר/ה",
  insolvency:"סימנתם: הליך חדלות פירעון"};
const pause=r=>{const [b,u]=String(r).split(":until=");const t=BLOCK[b]||PAUSE[b]||"מושהה עד שתבדקו";
  return u?t+" · עד "+u.split("-").reverse().join("."):t};
const BLOCK={no_contact:"אין נייד או מייל תקין",compliance:"נחסם במסנן הניסוח",plan_active:"בהסדר תשלומים",disputed:"מחלוקת",no_payment_link:"אין קישור תשלום",
  no_reply_to:"ללקוח יש רק מייל ולא הוגדרה כתובת תשובה לעסק",
  opted_out:"הלקוח ביקש הסרה",paid_claim:"הלקוח טוען ששילם",dispute:"מחלוקת",credit_review:"זיכוי לא משויך, לבדיקתך",
  invoice_closed:"החשבונית נסגרה",plan_request:"ביקש פריסה"};
// הפעלה 133: חסימה קשה = HARD_BLOCKS בשרת (אסור לאשר). REAPPROVE = התזכורת רק חזרה לאישור, השרת מתיר.
const HARD=["no_contact","no_payment_link","compliance","no_reply_to"];
const REAPPROVE={approval_expired:"האישור הקודם פג (חיכה יותר מ-7 ימים). לאשר מחדש",
  approval_invalidated:"הנוסח השתנה מאז האישור. לאשר מחדש",
  amount_changed:"הסכום התעדכן מהמקור. לבדוק ולאשר מחדש",
  amount_check:"סכום חריג מאוד מהרגיל ללקוח. לבדוק שהוא נכון ולאשר במפורש",
  csv_stale:"עברו יותר מ-24 שעות מאישור «הסכום עדיין פתוח». לוודא שוב ולאשר מחדש",
  csv_missing_from_import:"החשבונית לא הופיעה בייבוא ה-CSV האחרון (אולי שולמה?). לבדוק ולאשר מחדש"};
// תווית קצרה לצ׳יפ: המשפט הראשון של ההסבר
const why=b=>REAPPROVE[b]?REAPPROVE[b].split(". ")[0]:pause(b);
// הפעלה 157: הצ׳יפ של תזכורת (בתור ובטבלת החובות). סיבה מ-REAPPROVE מתארת תזכורת ש*ממתינה* לאישור; אחרי
// שאושרה, נשלחה או נדחתה היא שארית ⇒ מציגים את הסטטוס. תזכורת מאושרת שהסכום שלה השתנה במקור (amount_drift
// מהשרת) מסומנת כמי שתחזור לאישור, כמו ההערה בלוח התצוגה (154).
const DRIFT="הסכום השתנה במקור, תחזור לאישורך";
const chipOf=r=>r.amount_drift?DRIFT:r.block_reason&&!(REAPPROVE[r.block_reason]&&r.status!=="pending_approval")?why(r.block_reason):STATUS[r.status]||r.status;
let sel=null,shown=null,pvHash=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=a=>(a/100).toLocaleString("he-IL",{minimumFractionDigits:a%100?2:0,maximumFractionDigits:2})+" ₪";
// מטבע שאינו ₪ ⇒ כמו templates.fmt_amount בשרת ($500, CHF 1,234.50); לא מציגים דולר כשקל
// הפעלה 138: מועד וערוצים של התזכורת האחרונה ש*יצאה* (last_sent מהשרת, לפי יומן היוצאים), לא של הטיוטה שבתור
const lastSent=x=>{const s=x.last_sent;if(!s)return"";if(s.unknown)return" · אחרונה: לא ידוע אם יצאה ⚠️";const [,m,d]=(s.sent_at||"").slice(0,10).split("-").map(Number);
  const ch=(s.channels||[]).map(c=>({sms:"📱",email:"✉️"}[c]||"")).join("");
  return (d&&m?` · אחרונה ${d}.${m}`:"")+(ch?" "+ch:"")};
const fmtCur=(a,c)=>{if(!c||c==="ILS")return money(a);const s={USD:"$",EUR:"€",GBP:"£"}[c]||c+" ";
  return s+Math.floor(a/100).toLocaleString("en-US")+(a%100?"."+String(a%100).padStart(2,"0"):"")};
// טוקן בעל העסק: נשמר רק ב-sessionStorage (נמחק בסגירת הלשונית), נשלח כ-Bearer
const TOK="gabi_owner_token";
function tok(){try{return sessionStorage.getItem(TOK)||""}catch(e){return ""}}
// הפעלה 145: אותה התנהגות כמו ב-/app/ (הפעלה 144).
//  • כתיבה שנקטעה (רשת, או 5xx בלי הסבר בעברית): אולי נרשמה בשרת ⇒ «לא ידוע אם הפעולה נרשמה», לא «נסו שוב» עיוור.
//  • 401 שלא נפתר בקוד חדש: הנתונים יורדים מהמסך, הטוקן נמחק מהלשונית, ומוצג פס כניסה.
const WRITE_UNKNOWN="לא ידוע אם הפעולה נרשמה. בדקו אחרי שהנתונים יתרעננו, לפני שמנסים שוב";
let locked=false,stale=false,rt=null,rn=0,loading=0,busy=false,got={d:false,q:false};
// הפעלה 146: כפתורי הכותרת כבויים כשהמסך נעול (אחרי 401, עד «כניסה») ובזמן שפעולה רצה (לחיצה כפולה).
// הפעלה 161: «↻ חידוש תזכורות» בטבלת החובות כבוי גם הוא בזמן פעולת כותרת (חידוש באמצע סנכרון או שליחה שינה
// את מצב הלקוח מתחת לפעולה שרצה). כפתור שהבקשה שלו עצמו באוויר (going) נשאר כבוי עד שהיא חוזרת.
function hdr(){for(const i of ["#btnSync","#btnPlan","#btnDispatch"])$(i).disabled=locked||busy;
  document.querySelectorAll("#debts button.resume").forEach(b=>{b.disabled=busy||!!b.dataset.going})}
const RETRY_MS=[2000,4000,8000,15000];
// הפעלה 150: בכניסה ראשונה (ואחרי כניסה מחדש) הדף היה ריק עד שהשרת ענה: כותרות בלי מספרים, טבלה ותור ריקים.
// עכשיו שלד טעינה בכל חלק שעוד לא נטען (got). השלד מוסתר מקורא מסך; הוא שומע «טוען נתונים…» פעם אחת.
// חלק שנכשל בטעינה הראשונה מציג «לא נטען», לא שלד שמהבהב לנצח ולא טבלה ריקה שנראית כמו «אין חובות».
const SK='<span class="sk"></span>';
function busyOff(){$("#dash").removeAttribute("aria-busy");$("#list").removeAttribute("aria-busy");$("#busyMsg").textContent=""}
function skel(){if(got.d&&got.q)return;
  if(!got.d){$("#kpis").innerHTML=Array(8).fill('<div class="card kpi" aria-hidden="true"><span class="sk big"></span><span class="sk w"></span></div>').join("");
    $("#debts").innerHTML=Array(3).fill(`<tr class="skrow" aria-hidden="true">${`<td>${SK}</td>`.repeat(7)}</tr>`).join("")}
  if(!got.q)$("#list").innerHTML=Array(3).fill(`<div class="card skitem" aria-hidden="true"><span class="sk w"></span>${SK}</div>`).join("");
  $("#dash").setAttribute("aria-busy","true");$("#list").setAttribute("aria-busy","true");$("#busyMsg").textContent="טוען נתונים…"}
function lock(had){locked=true;stale=false;clearTimeout(rt);sel=shown=null;$("#detail").removeAttribute("aria-busy");try{sessionStorage.removeItem(TOK)}catch(e){}got={d:false,q:false};busyOff();
  for(const i of ["#kpis","#debts","#list","#df","#dmore"])$(i).innerHTML="";$("#today").textContent="";
  $("#detail").innerHTML='<div class="empty">בחרו תזכורת כדי לראות תצוגה מקדימה של SMS ומייל</div>';
  $("#loaderr").hidden=$("#wunk").hidden=$("#acterr").hidden=true;hdr();
  $("#lockMsg").textContent=had?"תוקף הכניסה פג. הנתונים הוסרו מהמסך. היכנסו שוב כדי להמשיך"
    :"כדי לראות את הנתונים צריך את קוד הגישה של בעל העסק";
  $("#locked").hidden=false}
function authErr(had){if(!locked)lock(had);return Object.assign(new Error("תוקף הכניסה פג"),{auth:true})}
async function api(p,o={},retry=true){
  // הפעלה 143: כשל רשת ו-5xx בלי הסבר מוצגים בעברית, לא «Failed to fetch» ולא קוד HTTP גולמי
  const write=!!o.method&&o.method!=="GET",sent=tok();
  const unknown=m=>Object.assign(new Error(m+". "+WRITE_UNKNOWN),{unknown:true});
  let r;try{r=await fetch(p,{...o,headers:{...(o.headers||{}),Authorization:"Bearer "+sent}})}
  catch(e){throw write?unknown("אין חיבור לשרת גבי"):new Error("אין חיבור לשרת גבי. בדקו את החיבור ונסו שוב")}
  if(r.status===401){
    // בקשה מקבילה כבר קיבלה קוד חדש ⇒ לא שואלים פעמיים; המשתמש כבר ביטל ⇒ לא שואלים שוב
    if(retry&&tok()&&tok()!==sent)return api(p,o,false);
    if(!retry||locked)throw authErr(!!sent);
    const t=prompt("קוד גישה של בעל העסק (OWNER_API_TOKEN):");
    if(!t||!t.trim())throw authErr(!!sent);
    try{sessionStorage.setItem(TOK,t.trim())}catch(e){}return api(p,o,false)}
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const d=typeof j.detail==="string"?j.detail:"",he=/[\u0590-\u05FF]/.test(d);
    if(r.status>=500&&!he&&write)throw unknown("השרת לא זמין כרגע");
    // הפעלה 146: 409 עם X-Gabi-Already = ההכרעה שביקשנו כבר נרשמה קודם (approved / rejected). לא כשל.

  boxes.forEach(x=>x.onchange=gate);gate();
  // הפעלה 159: תצוגה שנטענה באמצע פעולת כותרת (סנכרון / הכנה / שליחה) נשארת בלי כפתורי החלטה עד שהפעולה מסתיימת
  if(busy)freeze(d);
  okBtn&&(okBtn.onclick=()=>act("approve",{confirm_amount:!!($("#cAmt")&&$("#cAmt").checked),confirm_open:!!($("#cOpen")&&$("#cOpen").checked),seen_hash:p.body_hash}));noBtn&&(noBtn.onclick=()=>act("reject"));
}
const DONE={approve:"approved",reject:"rejected"};
// הפעלה 146: כשל בכפתורי הכותרת מוצג בשורה בדף (היה חלון קופץ של הדפדפן), ונסגר ב«הבנתי» או בפעולה הבאה
// הפעלה 159: בזמן פעולת כותרת כפתורי ההחלטה בלוח כבויים. סנכרון יכול לבנות את הנוסח מחדש ושליחה יכולה להוציא את
// התזכורת, ועד עכשיו אפשר היה לאשר או לדחות באותו רגע את הנוסח שעל המסך. בסיום (גם בכשל) התצוגה נטענת מחדש
// מהשרת, כי פעולה שנקטעה אולי נרשמה. busy יורד לפני הטעינה, כדי שהתצוגה החדשה תחזור עם כפתורים פעילים.
const run=(b,p)=>$(b).onclick=async()=>{busy=true;hdr();freeze($("#detail"));$("#acterr").hidden=true;
  try{await api(p,{method:"POST"});await load()}
  catch(e){failed(e,m=>{$("#actMsg").textContent="הפעולה לא בוצעה: "+m;$("#acterr").hidden=false})}
  finally{busy=false;hdr();sel&&show(sel)}};
$("#btnAct").onclick=()=>{$("#acterr").hidden=true};
$("#btnWunk").onclick=()=>{$("#wunk").hidden=true};
$("#btnLogin").onclick=()=>{locked=false;$("#locked").hidden=true;hdr();load()};
$("#btnRetry").onclick=async e=>{e.target.disabled=true;try{await load()}finally{e.target.disabled=false}};
run("#btnSync","/sync");run("#btnPlan","/plan");run("#btnDispatch","/dispatch");
load();
</script>
</body>
