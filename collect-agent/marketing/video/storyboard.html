<style>body{margin:0;background:#FBF8F1;color:#0F172A;font:16px/1.6 Heebo,system-ui,sans-serif}.d{background:#FEF3C7;color:#92400E;text-align:center;font-weight:700;padding:6px}main{max-width:1200px;margin:0 auto;padding:16px;display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}figure{margin:0;background:#fff;border:1px solid #E2E8F0;border-radius:16px;overflow:hidden}img{width:100%;display:block;background:#0F172A;max-height:420px;object-fit:contain}figcaption{padding:12px 14px}p{margin:6px 0}.os{color:#475569;font-size:14px}h1{margin:16px auto 0;max-width:1200px;padding:0 16px}</style></head>
<body><div class="d">טיוטה, לא לפרסום · פריימים מהמערכת האמיתית במצב בדיקה (dry-run), נתונים בדויים</div><h1>גבי · סטוריבורד לסרטון 60 שניות</h1><main><figure><img src="frames/01-hook.png" alt="הוק" loading="lazy"><figcaption><b>0–6 · הוק</b><p>🎙 עשית את העבודה. שלחת חשבונית. והכסף? עוד לא הגיע. ולא נעים לך להזכיר.</p><p class="os">📝 על המסך: הכסף שלך חוזר. בלי שתצטרך לרדוף.</p></figcaption></figure>
<figure><img src="frames/02-dashboard.png" alt="רגע ה-wow: מה פתוח" loading="lazy"><figcaption><b>6–14 · רגע ה-wow: מה פתוח</b><p>🎙 גבי מתחבר לחשבונית ירוקה, רק לקריאה, ומראה לך בבת אחת מה עוד פתוח ומה באיחור.</p><p class="os">📝 על המסך: חיבור לחשבונית ירוקה · קריאה בלבד</p></figcaption></figure>
<figure><img src="frames/03-preview.png" alt="תזכורת מוכנה" loading="lazy"><figcaption><b>14–24 · תזכורת מוכנה</b><p>🎙 כל בוקר מחכות לך תזכורות מוכנות. מנומסות, עובדתיות, עם קישור לתשלום. אתה רואה כל מילה.</p><p class="os">📝 על המסך: SMS ומייל · בשם העסק שלך</p></figcaption></figure>
<figure><img src="frames/04-approve.png" alt="אתה מאשר" loading="lazy"><figcaption><b>24–30 · אתה מאשר</b><p>🎙 שום הודעה לא יוצאת בלי שאישרת אותה. לחיצה אחת, וזהו.</p><p class="os">📝 על המסך: כל הודעה באישורך</p></figcaption></figure>
<figure><img src="frames/05-sms.png" alt="מה הלקוח רואה" loading="lazy"><figcaption><b>30–37 · מה הלקוח רואה</b><p>🎙 הלקוח מקבל הודעה קצרה מהעסק שלך. בשעה סבירה, לא בשבת ולא בחג.</p><p class="os">📝 על המסך: 08:00–20:00 · לא בשישי אחה״צ, שבת וחג</p><p class="os">ℹ️ הנוסח הוא ה-SMS האמיתי מיומן הדמו; רק הדומיין הוחלף ל-gabi.example (placeholder)</p></figcaption></figure>
<figure><img src="frames/06-pay.png" alt="תשלום בלחיצה" loading="lazy"><figcaption><b>37–45 · תשלום בלחיצה</b><p>🎙 לחיצה על הקישור מובילה לעמוד התשלום של העסק שלך. הכסף עובר ישירות אליך.</p><p class="os">📝 על המסך: אנחנו לא מחזיקים כסף</p></figcaption></figure>
<figure><img src="frames/07-reply.png" alt="הלקוח עונה" loading="lazy"><figcaption><b>45–53 · הלקוח עונה</b><p>🎙 ביקש תשלומים? גבי מכין הצעה בלי ריבית ומחכה לך. כתב ששילם? גבי עוצר. ואחרי שלוש תזכורות, גבי עוצר ומעדכן אותך.</p><p class="os">📝 על המסך: עד 3 תזכורות · ואז עצירה</p></figcaption></figure>
<figure><img src="frames/08-price.png" alt="סגירה" loading="lazy"><figcaption><b>53–60 · סגירה</b><p>🎙 גבי. תזכורות תשלום. ₪119 לחודש, ו-14 ימי ניסיון בלי כרטיס אשראי.</p><p class="os">📝 על המסך: ₪119 לחודש או ₪1,190 לשנה · כולל מע״מ ככל שחל · 14 ימי ניסיון</p></figcaption></figure></main></body></html>
