[project]
name = "collect-agent"
version = "0.1.0"
description = "סוכן גבייה לעסקים קטנים בישראל — שלד MVP (dry-run בלבד)"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",  # AES-GCM לסודות במנוחה (app/secretbox.py)
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.5",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "bandit>=1.7", "pip-audit>=2.7"]
# שער 5 · SQLCipher (DB_ENCRYPTION=sqlcipher, app/dbcrypt.py). אופציונלי: התקנת ברירת המחדל וה-CI בלי
# הדגל לא משתנות. נעילה עם hashes: requirements-sqlcipher.lock. רישיון: zlib (העטיפה) + BSD-3 (SQLCipher)
# + Apache-2.0 (OpenSSL המקושר סטטית ב-wheel) — מתירניים לשימוש מסחרי.
sqlcipher = ["sqlcipher3==0.6.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# רק app הוא חבילה (team/ שבר את ה-flat-layout של pip install -e)
packages = ["app"]

[tool.setuptools.package-data]
app = ["ui.html"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["demo-output", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]  # S = כללי bandit (אבטחה)
ignore = ["UP031", "UP042", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]  # טוקני-בדיקה מזויפים ו-random דטרמיניסטי לסימולציה
# מחרוזות-אימון עבריות ארוכות (315 מקרי eval) — שבירה תפגע בקריאוּת
"app/conversation.py" = ["E501"]
