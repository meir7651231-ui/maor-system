[project]
name = "collect-agent"
version = "0.1.0"
description = "סוכן גבייה לעסקים קטנים בישראל — שלד MVP (dry-run בלבד)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.5",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
# web/ (ממשק React) ו-team/ (מסמכים) יושבים כאן — לא חבילות פייתון
packages = ["app"]
