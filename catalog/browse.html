<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>קטלוג החלקים</title>
<link rel="icon" href="data:,">
<!--
  📇 דפדוף בקטלוג (CATALOG-INDEX, 14.10.2026). בלי תלויות חיצוניות.
  טוען index.json · verbs.json · behavior/<source>.json מאותה תיקייה — צריך שרת (למשל: npx vite preview, או python3 -m http.server מתוך catalog/).
-->
<style>
  :root {
    --bg: #f7f6f2; --card: #ffffff; --ink: #1d1d1b; --muted: #6a6862; --line: #e3e0d8;
    --accent: #2f5d8a; --accent-ink: #ffffff; --run: #2e7d4f; --twin: #7a5aa8; --static: #9a7b2f; --chip: #eef2f6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --card: #1e1e1c; --ink: #ecebe6; --muted: #a3a19a; --line: #34332f;
      --accent: #7fb0e0; --accent-ink: #0d1b28; --run: #6fcf97; --twin: #b9a0e3; --static: #e0c27a; --chip: #262a30;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413; --card: #1e1e1c; --ink: #ecebe6; --muted: #a3a19a; --line: #34332f;
    --accent: #7fb0e0; --accent-ink: #0d1b28; --run: #6fcf97; --twin: #b9a0e3; --static: #e0c27a; --chip: #262a30;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  header { padding: 16px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .sub { color: var(--muted); font-size: 13px; }
  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; padding: 12px 16px; position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); z-index: 2; }
  .controls input, .controls select, .controls button { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); font: inherit; min-height: 40px; }
  .controls .q { grid-column: 1 / -1; }
  .controls button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  main { padding: 12px 16px 40px; max-width: 1100px; margin: 0 auto; }
  .count { color: var(--muted); font-size: 13px; margin: 4px 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .name { font-weight: 600; }
  .id { direction: ltr; text-align: left; color: var(--muted); font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; overflow-wrap: anywhere; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 9px; font-size: 12px; white-space: nowrap; }
  .chip.verb { background: var(--accent); color: var(--accent-ink); cursor: pointer; border: 0; font: inherit; font-size: 12px; }
  .chip.verb.implied { opacity: .55; }
  .by-run { color: var(--run); } .by-twin { color: var(--twin); } .by-static { color: var(--static); }
  .kinds { direction: ltr; font: 12px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); overflow-wrap: anywhere; }
  .reason { color: var(--muted); font-size: 12px; }
  .group h2 { font-size: 17px; margin: 18px 0 2px; }
  .group .means { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .names { display: flex; flex-wrap: wrap; gap: 6px; }
  .names .chip { white-space: normal; }
  .src { font-size: 11px; color: var(--muted); margin-inline-start: 4px; }
  .more { display: block; margin: 12px auto; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; min-height: 40px; }
  .err { color: #b3261e; padding: 16px; }
  .theme { position: absolute; top: 12px; left: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 6px 10px; min-height: 36px; }
</style>
</head>
<body>
<header style="position:relative">
  <h1>📇 קטלוג החלקים</h1>
  <div class="sub" id="sub">טוען…</div>
  <button class="theme" id="theme" type="button" aria-label="החלפת ערכת צבע">🌓</button>
</header>
<div class="controls" role="search">
  <input class="q" id="q" type="search" placeholder="חיפוש: שם, מזהה, פועל (divide / מחלק), סוג (amount)…" aria-label="חיפוש">
  <select id="src" aria-label="מקור"><option value="">כל המקורות</option></select>
  <select id="verb" aria-label="פועל"><option value="">כל הפעלים</option></select>
  <select id="kind" aria-label="סוג"><option value="">כל הסוגים</option></select>
  <select id="by" aria-label="איך תויג">
    <option value="">כל התוויות</option>
    <option value="run">הורץ (נמדד)</option>
    <option value="twin">תאום (העתק של חלק שהורץ)</option>
    <option value="static">סטטי (ניחוש משם)</option>
    <option value="none">בלי פועל</option>
  </select>
  <button id="same" type="button" aria-pressed="false">🔁 אותה פעולה, שמות שונים</button>
</div>
<main>
  <div class="count" id="count"></div>
  <div id="out"></div>
  <button class="more" id="more" type="button" hidden>עוד…</button>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const HE = { orbit: 'אורביט', buildsmart: 'בנייה-חכמה', generator: 'המחולל', rings: 'מנוע-הטבעות', yeshiva: 'הישיבה', 'qa-scanner': 'סורק-האיכות', 'yoman-habina': 'יומן-הבינה', '14kk': '14kk', mmmm: 'MMMM' };
  const BY = { run: 'הורץ', twin: 'תאום', static: 'סטטי' };
  const PAGE = 150;
  let parts = []; let verbs = new Map(); let beh = new Map(); let shown = PAGE; let sameMode = false;

  try { const t = localStorage.getItem('catalog-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* בלי אחסון */ }
  $('theme').onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('catalog-theme', next); } catch (e) { /* בלי אחסון */ }
  };

  async function load() {
    const [ix, vj] = await Promise.all([fetch('index.json').then((r) => r.json()), fetch('verbs.json').then((r) => r.json())]);
    for (const v of vj.verbs) verbs.set(v.id, v);
    const files = await Promise.all(ix.sources.map((s) => fetch('behavior/' + s.source + '.json').then((r) => (r.ok ? r.json() : null)).catch(() => null)));
    for (const f of files) if (f) for (const e of f.parts) beh.set(e.id, e);
    parts = ix.parts.map((p) => {
      const b = beh.get(p.id);
      const vs = b ? b.verbs : [];
      const text = [p.name, p.id, p.source, HE[p.source], p.gives, ...p.takes, ...vs.map((v) => v.id + ' ' + (verbs.get(v.id)?.he ?? ''))].join(' ').toLowerCase();
      return { ...p, b, text };
    });
    const rank = (s) => { const k = ix.sources.findIndex((x) => x.source === s); return k < 0 ? 99 : k; };
    parts.sort((a, b) => rank(a.source) - rank(b.source) || (a.id < b.id ? -1 : 1));
    $('sub').textContent = ix.totals.parts.toLocaleString('he') + ' חלקים · ' + ix.sources.length + ' מקורות · ' + vj.verbs.length + ' פעלים · ' + ix.dups.groups + ' קבוצות כפולים בין מקורות';
    for (const s of ix.sources) $('src').insertAdjacentHTML('beforeend', '<option value="' + esc(s.source) + '">' + esc(HE[s.source] ?? s.source) + ' (' + s.parts + ')</option>');
    for (const v of vj.verbs) $('verb').insertAdjacentHTML('beforeend', '<option value="' + esc(v.id) + '">' + esc(v.he) + ' · ' + esc(v.id) + '</option>');
    const kinds = new Set(); for (const p of parts) { kinds.add(p.gives); for (const k of p.takes) kinds.add(k); }
    for (const k of [...kinds].sort((a, b) => (a.startsWith('record:') - b.startsWith('record:')) || (a < b ? -1 : 1)).slice(0, 400)) $('kind').insertAdjacentHTML('beforeend', '<option value="' + esc(k) + '">' + esc(k) + '</option>');
    render();
  }

  function filtered() {
    const q = $('q').value.trim().toLowerCase();
    const src = $('src').value; const verb = $('verb').value; const kind = $('kind').value; const by = $('by').value;
    return parts.filter((p) => {
      if (src && p.source !== src) return false;
      if (kind && p.gives !== kind && !p.takes.includes(kind)) return false;
      const vs = p.b ? p.b.verbs : [];
      if (verb && !vs.some((v) => v.id === verb)) return false;
      if (by === 'none') { if (vs.length) return false; } else if (by && (!p.b || p.b.labeledBy !== by)) return false;
      if (q && !q.split(/\s+/).every((w) => p.text.includes(w))) return false;
      return true;
    });
  }

  function card(p) {
    const b = p.b;
    const vs = b ? b.verbs : [];
    const chips = vs.map((v) => '<button type="button" class="chip verb' + (v.implied ? ' implied' : '') + '" data-verb="' + esc(v.id) + '" title="' + esc((verbs.get(v.id)?.means ?? '') + (v.holds ? ' · ' + v.holds + ' מקרים' : '') + (v.on ? ' · על ' + v.on : '')) + '">' + esc(verbs.get(v.id)?.he ?? v.id) + (v.holds ? ' ✓' : '') + '</button>').join('');
    return '<div class="card"><div class="name">' + esc(p.name) + '</div><div class="id">' + esc(p.id) + '</div>' +
      '<div class="row"><span class="chip">' + esc(HE[p.source] ?? p.source) + '</span><span class="chip">' + esc(p.what) + ' · ' + esc(p.lang) + '</span>' +
      (b ? '<span class="chip by-' + b.labeledBy + '">' + BY[b.labeledBy] + (b.twinOf ? ' של ' + esc(b.twinOf.split('#')[1]) : '') + '</span>' : '') + chips +
      (p.dup ? '<span class="chip" title="אותו שם בכמה מקורות">🔗 ' + esc(p.dup) + '</span>' : '') + '</div>' +
      '<div class="row kinds">' + esc((p.takes.join(' + ') || '—') + ' ⇒ ' + p.gives) + (b && b.material && vs.length ? ' · חומר: ' + esc(b.material) : '') + '</div>' +
      (b && b.reason ? '<div class="reason">לא הורץ: ' + esc(b.reason) + '</div>' : '') + '</div>';
  }

  function groups(list) {
    const by = new Map();
    for (const p of list) { const v = p.b && p.b.primary; if (!v) continue; if (!by.has(v)) by.set(v, []); by.get(v).push(p); }
    const order = [...verbs.keys()].filter((v) => by.has(v));
    return order.map((v) => {
      const ps = by.get(v);
      const srcs = new Set(ps.map((p) => p.source));
      const names = [...new Map(ps.map((p) => [p.name, p])).values()].slice(0, 40);
      return '<section class="group"><h2>' + esc(verbs.get(v)?.he) + ' <span class="src">' + esc(v) + ' · ' + ps.length + ' חלקים · ' + srcs.size + ' מקורות</span></h2>' +
        '<div class="means">' + esc(verbs.get(v)?.means) + '</div><div class="names">' +
        names.map((p) => '<span class="chip by-' + p.b.labeledBy + '" title="' + esc(p.id) + '">' + esc(p.name) + '<span class="src">' + esc(HE[p.source] ?? p.source) + '</span></span>').join('') + '</div></section>';
    }).join('');
  }

  function render() {
    const list = filtered();
    $('count').textContent = list.length.toLocaleString('he') + ' חלקים';
    if (sameMode) { $('out').innerHTML = groups(list); $('more').hidden = true; return; }
    $('out').innerHTML = list.slice(0, shown).map(card).join('');
    $('more').hidden = list.length <= shown;
  }

  for (const id of ['q', 'src', 'verb', 'kind', 'by']) $(id).addEventListener('input', () => { shown = PAGE; render(); });
  $('more').onclick = () => { shown += PAGE; render(); };
  $('same').onclick = () => { sameMode = !sameMode; $('same').setAttribute('aria-pressed', String(sameMode)); render(); };
  $('out').addEventListener('click', (ev) => { const v = ev.target.closest('[data-verb]'); if (v) { $('verb').value = v.dataset.verb; shown = PAGE; render(); } });
  load().catch((e) => { $('out').innerHTML = '<div class="err">לא הצלחתי לטעון את הקטלוג (' + esc(e.message) + '). פתחו את הדף דרך שרת מקומי מתוך catalog/.</div>'; $('sub').textContent = ''; });
})();
</script>
</body>
</html>
