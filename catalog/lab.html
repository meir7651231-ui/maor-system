<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מעבדת המצרף</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🧲%3C/text%3E%3C/svg%3E">
<meta name="description" content="כותבים מילה אחת — והמכונה מרכיבה אותה מחלקים קטנים מכל הפרויקטים, מוכיחה מה שאפשר, ושולחת לבנייה את מה שחסר.">
<style>
:root{
  --bg:#f6f5fb; --surface:#ffffff; --surface-2:#f0eef8; --ink:#1b1830; --ink-2:#4a4566; --ink-3:#6f6a8a;
  --line:#e3e0ef; --accent:#5b3fd6; --accent-ink:#ffffff; --ok:#0b7a4b; --ok-bg:#e3f6ec; --ex:#1c64b5; --ex-bg:#e5effb;
  --run:#7a5b00; --run-bg:#fbf1d6; --miss:#b4231a; --miss-bg:#fdecea; --miss-line:#f4b9b3; --shadow:0 1px 2px rgba(20,16,50,.06),0 6px 24px rgba(20,16,50,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121019; --surface:#1b1826; --surface-2:#242033; --ink:#f1eefc; --ink-2:#c9c3e4; --ink-3:#9a93b8;
    --line:#302b45; --accent:#9b86ff; --accent-ink:#130f22; --ok:#5fd59c; --ok-bg:#163327; --ex:#7db6ff; --ex-bg:#172a42;
    --run:#f2cd6b; --run-bg:#33290e; --miss:#ff8d84; --miss-bg:#3a1714; --miss-line:#6b2a24; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#121019; --surface:#1b1826; --surface-2:#242033; --ink:#f1eefc; --ink-2:#c9c3e4; --ink-3:#9a93b8;
  --line:#302b45; --accent:#9b86ff; --accent-ink:#130f22; --ok:#5fd59c; --ok-bg:#163327; --ex:#7db6ff; --ex-bg:#172a42;
  --run:#f2cd6b; --run-bg:#33290e; --miss:#ff8d84; --miss-bg:#3a1714; --miss-line:#6b2a24; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Rubik,Heebo,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 64px}
header{display:flex;flex-direction:column;gap:4px;margin:8px 0 16px}
h1{font-size:24px;line-height:1.2;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink-2);margin:0;font-size:15px}
.stats{color:var(--ink-3);font-size:13px}
.ask{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:8px}
.ask input{flex:1 1 200px;min-width:0;font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.ask input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;min-height:44px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.samples{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.samples button{min-height:34px;padding:4px 12px;border-radius:999px;font-size:14px;background:transparent;color:var(--ink-2)}
section{margin-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.out h2{margin:0 0 6px;font-size:14px;color:var(--accent);letter-spacing:.02em}
.out .title{font-size:20px;font-weight:700;margin:0 0 8px;line-height:1.3}
.out p{margin:0;color:var(--ink-2)}
.kpis{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.kpi{background:var(--surface-2);border-radius:12px;padding:8px 12px;min-width:84px}
.kpi b{display:block;font-size:20px;line-height:1.1}
.kpi span{font-size:12px;color:var(--ink-3)}
.kpi.miss b{color:var(--miss)} .kpi.ok b{color:var(--ok)}
.projs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}
.group h3{font-size:15px;margin:22px 0 8px;color:var(--ink-2)}
.need{display:grid;gap:10px;margin-bottom:10px}
.need .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;justify-content:space-between}
.need .beh{font-weight:650;font-size:16px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--ink-2);background:var(--surface-2)}
.chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.arrow{align-self:center;color:var(--ink-3);font-size:18px}
.part{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-inline-start:5px solid var(--c,#999);border-radius:12px;padding:8px 10px;background:var(--surface-2);min-width:0;flex:1 1 180px;max-width:100%}
.part .nm{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.part .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink-3)}
.proof{font-size:12px;font-weight:600;border-radius:8px;padding:1px 7px}
.proof.proven{background:var(--ok-bg);color:var(--ok)} .proof.example{background:var(--ex-bg);color:var(--ex)}
.proof.runnable{background:var(--run-bg);color:var(--run)} .proof.static{background:var(--surface);color:var(--ink-3);border:1px solid var(--line)}
.sent{color:var(--ink-2);font-size:14px;margin:0}
.flow{font-size:12px;color:var(--ok)}
details{font-size:14px;color:var(--ink-2)} details summary{cursor:pointer;color:var(--ink-3)}
details .alt{margin:8px 0;padding-inline-start:8px;border-inline-start:2px solid var(--line)}
.miss-card{background:var(--miss-bg);border:1px solid var(--miss-line);border-radius:16px;padding:14px;display:grid;gap:8px;margin-bottom:10px}
.miss-card .beh{color:var(--miss);font-weight:700}
.miss-card button{border-color:var(--miss-line);background:var(--surface);color:var(--miss);font-weight:600}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;direction:ltr;text-align:left;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:4px 12px;border-radius:999px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.picked{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.muted{color:var(--ink-3);font-size:13px}
.toast{position:fixed;inset-inline:16px;bottom:16px;margin:auto;max-width:420px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
.toast.on{opacity:1}
.err{color:var(--miss)}
@media (min-width:760px){ h1{font-size:30px} .out .title{font-size:24px} }
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧲 המצרף</h1>
    <p class="sub">כותבים מילה אחת — והמכונה מרכיבה אותה מחלקים קטנים מכל מה שבנינו.</p>
    <div class="stats" id="stats">טוען את הקטלוג…</div>
  </header>

  <form class="ask" id="form" autocomplete="off">
    <label for="word" class="muted" style="flex-basis:100%">כתוב מילה אחת</label>
    <input id="word" name="word" placeholder="למשל: חמנייה" enterkeyhint="go">
    <button class="primary" type="submit">הרכב</button>
    <button type="button" id="rand">🎲 מילה אקראית</button>
  </form>
  <div class="samples" id="samples" aria-label="מילים מהמילון"></div>

  <main id="out" aria-live="polite"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { indexOf, assemble, findGoal, askChips, goalFromChips, recipeFrom, recipePart, PROJECTS, kindHe, TIER_HE, VERB_HE as verbHe } from './combiner/core.mjs';
import { useAlphabet } from './combiner/verbs.mjs';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const toast = (t) => { const el = $('#toast'); el.textContent = t; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 2200); };

let DATA, IX, VERB_HE = {};
const SHELF_KEY = 'combiner.shelf';
const shelf = () => { try { return JSON.parse(localStorage.getItem(SHELF_KEY) || '[]'); } catch { return []; } };
const saveShelf = (xs) => { try { localStorage.setItem(SHELF_KEY, JSON.stringify(xs)); } catch { /* פרטי */ } };

function rebuild() {
  const extra = shelf().filter((r) => !DATA.recipes.some((x) => x.id === r.id));
  const parts = [...DATA.parts.filter((p) => !p.id.startsWith('recipe:') || !extra.some((r) => 'recipe:' + r.id === p.id)), ...extra.map((r) => recipePart(r, DATA.parts))];
  parts.sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  IX = indexOf(parts, DATA.flows);
}

async function boot() {
  try {
    DATA = await (await fetch('./combiner/lab-data.json')).json();
  } catch {
    $('#stats').innerHTML = '<span class="err">לא הצלחתי לטעון את הקטלוג. פתחו את הדף דרך שרת (למשל <code>npx vite preview</code> או <code>python3 -m http.server</code> מתיקיית השורש).</span>';
    return;
  }
  useAlphabet(DATA.verbs);
  DATA.verbs.forEach((v) => (VERB_HE[v.id] = v.he));
  VERB_HE[DATA.recipeVerb.id] = DATA.recipeVerb.he;
  rebuild();
  const srcs = new Set(DATA.parts.flatMap((p) => p.homes.map((h) => h.source)));
  const proven = DATA.parts.filter((p) => Object.values(p.proofs || {}).some((x) => x.status === 'proven')).length;
  $('#stats').textContent = DATA.parts.length.toLocaleString('he') + ' חלקים עם פועל · ' + srcs.size + ' פרויקטים · ' + proven + ' מוכחים בהרצה · ' + DATA.goals.length + ' מילים במילון · תיוג ' + (DATA.labeledBy === 'behavior' ? 'מהתנהגות' : 'זמני (מהשמות)');
  // 12 מילים לדוגמה (החמנייה של הבעלים ראשונה, ואז אחת מכל עולם); השאר — ב-🎲
  const seen = new Set();
  const sample = DATA.goals.filter((g) => (g.owner || !seen.has(g.world)) && seen.add(g.world)).slice(0, 12);
  $('#samples').innerHTML = sample.map((g) => `<button type="button" data-w="${esc(g.word)}">${esc(g.word)}</button>`).join('');
  $('#samples').onclick = (e) => { const w = e.target.closest('button')?.dataset.w; if (w) go(w); };
  fromHash();
  window.addEventListener('hashchange', fromHash);
}

function fromHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('w')) go(h.get('w'));
  else if (h.get('seed')) go(DATA.goals[Number(h.get('seed')) % DATA.goals.length].word);
}

function go(word) {
  $('#word').value = word;
  try { history.replaceState(null, '', '#w=' + encodeURIComponent(word)); } catch { /* */ }
  const goal = findGoal(word, DATA.goals);
  if (!goal) return renderAsk(askChips(word));
  render(assemble(goal, IX));
}

$('#form').onsubmit = (e) => { e.preventDefault(); const w = $('#word').value.trim(); if (w) go(w); };
$('#rand').onclick = () => {
  const xs = DATA.goals.filter((g) => g.word !== $('#word').value);
  go(xs[Math.floor(Math.random() * xs.length)].word);
};

const badge = (src) => `<span class="badge" style="background:${PROJECTS[src]?.color || '#666'}">${esc(PROJECTS[src]?.he || src)}</span>`;
const proofBadge = (s) =>
  s.proof === 'proven' ? `<span class="proof proven" title="${esc(s.laws.join(' · '))}">✅ מוכח · ${s.cases} קלטים</span>`
  : s.proof === 'example' ? '<span class="proof example">☑️ נבדק על דוגמה</span>'
  : s.tier === 'runnable' ? '<span class="proof runnable">▶ ניתן להרצה</span>'
  : '<span class="proof static">סטטי</span>';

function chainHtml(c) {
  return '<div class="chain">' + c.steps.map((s, i) =>
    (i ? '<span class="arrow" aria-hidden="true">←</span>' : '') +
    `<div class="part" style="--c:${PROJECTS[s.source]?.color || '#888'}">
       <div class="nm">${esc(s.name)}</div>
       <div class="meta">${s.homes.map(badge).join('')}${proofBadge(s)}<span>${esc(s.takes.map(kindHe).join(' + ') || '—')} ⇒ ${esc(kindHe(s.gives))}</span></div>
       ${s.flow?.status === 'proven' ? `<div class="flow">⟵ זרימה מהחלק הקודם הוכחה · ${s.flow.cases} קלטים</div>` : ''}
     </div>`).join('') + '</div>';
}

function render(a) {
  const found = a.needs.filter((n) => n.chain);
  const steps = found.flatMap((n) => n.chain.steps);
  const proven = steps.filter((s) => s.proof === 'proven').length;
  let html = `<section class="card out">
    <h2>מה יצא</h2>
    <div class="title">«${esc(a.goal.word)}»${a.goal.title ? ' — ' + esc(a.goal.title) : ''}</div>
    <p>${esc(a.outcome)}</p>
    <div class="kpis">
      <div class="kpi ok"><b>${found.length}/${a.needs.length}</b><span>צרכים נמצאו</span></div>
      <div class="kpi"><b>${new Set(steps.map((s) => s.id)).size}</b><span>חלקים</span></div>
      <div class="kpi ok"><b>${proven}</b><span>צעדים מוכחים</span></div>
      <div class="kpi miss"><b>${a.missing.length}</b><span>חסרים</span></div>
    </div>
    <div class="projs">${a.projects.map(badge).join('')}</div>
    ${found.length ? '<div style="margin-top:12px"><button type="button" id="save">💾 שמור כמתכון — יהפוך לחלק חדש</button></div>' : ''}
  </section>`;

  if (a.missing.length) {
    html += '<section><h3 class="group" style="color:var(--miss)">🚧 חסר — הצעד של Waze: נשלח לבנייה</h3>' + a.missing.map((m, i) => `
      <div class="miss-card">
        <div class="beh">${esc(m.behavior)}</div>
        <div class="tags"><span class="tag">${esc(m.verbHe)}</span><span class="tag">נותן: ${esc(kindHe(m.gives))}</span>${m.takes.length ? `<span class="tag">מקבל: ${esc(m.takes.map(kindHe).join(' + '))}</span>` : ''}${m.detail ? `<span class="tag">${esc(m.detail)}</span>` : ''}</div>
        <div><button type="button" data-send="${i}">📤 שלח לבנייה</button></div>
        <pre hidden id="req-${i}">${esc(JSON.stringify(m, null, 2))}</pre>
      </div>`).join('') + '</section>';
  }

  let lastGroup = null;
  html += '<section>';
  a.needs.forEach((n) => {
    const g = n.need.group || '';
    if (g !== lastGroup) { html += g ? `<div class="group"><h3>${esc(g)}</h3></div>` : (lastGroup ? '<div class="group"><h3>&nbsp;</h3></div>' : ''); lastGroup = g; }
    const verb = verbHe(n.need.verb);
    if (!n.chain) {
      html += `<div class="card need" style="border-color:var(--miss-line)"><div class="head"><span class="beh">${esc(n.need.behavior)}</span><span class="tags"><span class="tag">${esc(verb)}</span><span class="tag">${esc(kindHe(n.need.material))}</span></span></div><p class="sent" style="color:var(--miss)">אין עדיין חלק שעושה את זה — ראו "חסר" למעלה.</p></div>`;
      return;
    }
    html += `<div class="card need">
      <div class="head"><span class="beh">${esc(n.need.behavior)}</span>
        <span class="tags"><span class="tag">${esc(verb)}</span><span class="tag">${esc(kindHe(n.need.material))}</span><span class="tag">טבעת ${n.ring}</span><span class="tag">${esc(TIER_HE[n.chain.tier])}</span></span></div>
      ${chainHtml(n.chain)}
      <p class="sent">${esc(n.chain.sentence)}</p>
      ${n.groupFlow ? `<div class="flow">⟵ הפלט של «${esc(n.groupFlow.from)}» נכנס לכאן — הוכח על ${n.groupFlow.cases} קלטים</div>` : ''}
      ${n.alternatives.length ? `<details><summary>עוד ${n.alternatives.length} דרכים</summary>${n.alternatives.map((c) => `<div class="alt">${chainHtml(c)}</div>`).join('')}</details>` : ''}
    </div>`;
  });
  html += '</section>';
  $('#out').innerHTML = html;

  $('#out').querySelectorAll('[data-send]').forEach((b) => (b.onclick = () => {
    const i = b.dataset.send;
    const pre = $('#req-' + i);
    pre.hidden = false;
    const text = pre.textContent;
    try { navigator.clipboard?.writeText(text); } catch { /* */ }
    download(a.missing[i].goal + '.' + a.missing[i].need + '.json', text);
    toast('בקשת-הבנייה הועתקה והורדה — שימו אותה ב-catalog/combiner/missing/');
  }));
  const save = $('#save');
  if (save) save.onclick = () => {
    const r = recipeFrom(a);
    saveShelf([...shelf().filter((x) => x.id !== r.id), r]);
    rebuild();
    download(r.id + '.json', JSON.stringify(r, null, 1) + '\n');
    toast('נשמר על המדף — «' + a.goal.word + '» הוא עכשיו חלק שאפשר לבנות עליו');
  };
}

function download(name, text) {
  try {
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const el = Object.assign(document.createElement('a'), { href: url, download: name });
    document.body.appendChild(el); el.click(); el.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch { /* */ }
}

/* מילה לא מוכרת — שאלה סגורה: פועל + חומר */
function renderAsk(ask) {
  const picks = [];
  let verb = null;
  const draw = () => {
    $('#out').innerHTML = `<section class="card">
      <h2 style="margin:0 0 6px;font-size:18px">❓ ${esc(ask.question)}</h2>
      <p class="muted">לא מנחשים עולם. בוחרים מה היא עושה (פועל) ועל מה (חומר) — צורך אחרי צורך.</p>
      <div class="muted" style="margin-top:10px">1 · מה היא עושה?</div>
      <div class="chips" id="vchips">${ask.verbs.map((v) => `<button type="button" class="chip" aria-pressed="${verb === v.id}" data-v="${v.id}" title="${esc(v.plain)}">${esc(v.he)}</button>`).join('')}</div>
      <div class="muted" style="margin-top:10px">2 · על מה?</div>
      <div class="chips" id="mchips">${ask.materials.map((m) => `<button type="button" class="chip" data-m="${m.id}" ${verb ? '' : 'disabled'}>${esc(m.he)}</button>`).join('')}</div>
      <div class="picked">${picks.map((p, i) => `<span class="tag">${esc(VERB_HE[p.verb])} · ${esc(kindHe(p.material))} <a href="#" data-x="${i}" aria-label="הסר">✕</a></span>`).join('') || '<span class="muted">עוד לא נבחרו צרכים</span>'}</div>
      <button type="button" class="primary" id="build" ${picks.length ? '' : 'disabled'}>הרכב את «${esc(ask.word)}»</button>
    </section>`;
    $('#vchips').onclick = (e) => { const v = e.target.closest('[data-v]')?.dataset.v; if (v) { verb = v; draw(); } };
    $('#mchips').onclick = (e) => { const m = e.target.closest('[data-m]')?.dataset.m; if (m && verb) { picks.push({ verb, material: m }); verb = null; draw(); } };
    $('#out').querySelectorAll('[data-x]').forEach((x) => (x.onclick = (e) => { e.preventDefault(); picks.splice(Number(x.dataset.x), 1); draw(); }));
    $('#build').onclick = () => render(assemble(goalFromChips(ask.word, picks), IX));
  };
  draw();
}

boot();
</script>
</body>
</html>
