<text x="493.0" y="126" text-anchor="middle" font-size="22" font-weight="700" fill="#211d17" font-family="'Segoe UI','Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif">config.json</text>
<text x="493.0" y="158" text-anchor="middle" font-size="16" font-weight="400" fill="#5c5347" font-family="'Segoe UI','Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif">flags · terms · theme</text>
<line x1="628" y1="134" x2="658" y2="134" stroke="#1f78b4" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="664" y="86" width="262" height="96" rx="14" fill="#ffffff" stroke="#d9cfbf" stroke-width="2"/>
<text x="795.0" y="126" text-anchor="middle" font-size="22" font-weight="700" fill="#211d17" font-family="'Segoe UI','Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif">Vertical pack</text>
<text x="795.0" y="158" text-anchor="middle" font-size="16" font-weight="400" fill="#5c5347" font-family="'Segoe UI','Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif">13 ready-made verticals</text>
<line x1="930" y1="134" x2="960" y2="134" stroke="#1f78b4" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="966" y="86" width="262" height="96" rx="14" fill="#fdf1d8" stroke="#a05008" stroke-width="2"/>
<text x="1097.0" y="126" text-anchor="middle" font-size="22" font-weight="700" fill="#a05008" font-family="'Segoe UI','Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif">The app</text>
<text x="1097.0" y="158" text-anchor="middle" font-size="16" font-weight="400" fill="#5c5347" font-family="'Segoe UI','Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif">only the modules you enabled</text>
<text x="60" y="238" text-anchor="start" font-size="22" font-weight="700" fill="#1d5f8f" font-family="'Segoe UI','Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif">② Where data lives — three local layers</text>
<rect x="60" y="262" width="356" height="100" rx="14" fill="#ffffff" stroke="#1f78b4" stroke-opacity=".55" stroke-width="2"/>
<circle cx="90" cy="290" r="15" fill="#1f78b4"/>
<text x="90" y="296" text-anchor="middle" font-size="16" font-weight="800" fill="#faf7f2" font-family="'Segoe UI','Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif">1</text>
<text x="238.0" y="304" text-anchor="middle" font-size="22" font-weight="700" fill="#211d17" font-family="'Segoe UI','Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif">localStorage</text>
<text x="238.0" y="338" text-anchor="middle" font-size="16" font-weight="400" fill="#5c5347" font-family="'Segoe UI','Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif">auto-save after half a second</text>
<line x1="420" y1="312" x2="456" y2="312" stroke="#1f78b4" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="462" y="262" width="356" height="100" rx="14" fill="#ffffff" stroke="#1f78b4" stroke-opacity=".55" stroke-width="2"/>
<circle cx="492" cy="290" r="15" fill="#1f78b4"/>
<text x="492" y="296" text-anchor="middle" font-size="16" font-weight="800" fill="#faf7f2" font-family="'Segoe UI','Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif">2</text>
<text x="640.0" y="304" text-anchor="middle" font-size="22" font-weight="700" fill="#211d17" font-family="'Segoe UI','Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif">IndexedDB</text>
<text x="640.0" y="338" text-anchor="middle" font-size="16" font-weight="400" fill="#5c5347" font-family="'Segoe UI','Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif">second copy + 30 daily snapshots</text>
<line x1="822" y1="312" x2="858" y2="312" stroke="#1f78b4" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="864" y="262" width="356" height="100" rx="14" fill="#ffffff" stroke="#1f78b4" stroke-opacity=".55" stroke-width="2"/>
<circle cx="894" cy="290" r="15" fill="#1f78b4"/>
<text x="894" y="296" text-anchor="middle" font-size="16" font-weight="800" fill="#faf7f2" font-family="'Segoe UI','Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif">3</text>
<text x="1042.0" y="304" text-anchor="middle" font-size="22" font-weight="700" fill="#211d17" font-family="'Segoe UI','Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif">JSON files</text>
<text x="1042.0" y="338" text-anchor="middle" font-size="16" font-weight="400" fill="#5c5347" font-family="'Segoe UI','Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif">manual + end-of-day backups</text>
<text x="60" y="420" text-anchor="start" font-size="22" font-weight="700" fill="#6a4fc9" font-family="'Segoe UI','Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif">③ Optional</text>
<rect x="60" y="444" width="557" height="84" rx="14" fill="#ffffff" stroke="#6a4fc9" stroke-dasharray="7 6" stroke-width="2"/>
<text x="338.5" y="480" text-anchor="middle" font-size="21" font-weight="700" fill="#211d17" font-family="'Segoe UI','Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif">☁ Firebase cloud</text>
<text x="338.5" y="510" text-anchor="middle" font-size="16" font-weight="400" fill="#5c5347" font-family="'Segoe UI','Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif">multi-device sync, per org</text>
<rect x="663" y="444" width="557" height="84" rx="14" fill="#ffffff" stroke="#6a4fc9" stroke-dasharray="7 6" stroke-width="2"/>
<text x="941.5" y="480" text-anchor="middle" font-size="21" font-weight="700" fill="#211d17" font-family="'Segoe UI','Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif">🔒 AES-GCM encryption</text>
<text x="941.5" y="510" text-anchor="middle" font-size="16" font-weight="400" fill="#5c5347" font-family="'Segoe UI','Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif">key wrapped by password + recovery key</text>
<text x="640.0" y="568" text-anchor="middle" font-size="17" font-weight="400" fill="#7a6f60" font-family="'Segoe UI','Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif">Without the cloud the site is fully static: no server, no monthly cost</text>
</svg>
