<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-label="How it works: per-organization config dresses the app, and data is kept in three local layers, with optional cloud and encryption">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f78b4"/></marker></defs>
<rect width="1280" height="600" rx="24" fill="#faf7f2"/>
<text x="60" y="62" text-anchor="start" font-size="22" font-weight="700" fill="#1d5f8f" font-family="'Segoe UI','Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif">① Who you are — per-organization config</text>
<rect x="60" y="86" width="262" height="96" rx="14" fill="#ffffff" stroke="#d9cfbf" stroke-width="2"/>
<text x="191.0" y="126" text-anchor="middle" font-size="22" font-weight="700" fill="#211d17" font-family="'Segoe UI','Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif">?org=slug</text>
<text x="191.0" y="158" text-anchor="middle" font-size="16" font-weight="400" fill="#5c5347" font-family="'Segoe UI','Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif">one URL per organization</text>
<line x1="326" y1="134" x2="356" y2="134" stroke="#1f78b4" stroke-width="2.5" marker-end="url(#ar)"/>
