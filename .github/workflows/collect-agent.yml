# גבי (collect-agent) — בדיקות + שער אבטחה. רץ רק כשמשהו תחת collect-agent/ משתנה.
# אין כאן deploy, אין סודות, אין רשת חיצונית בבדיקות (socket חסום ב-conftest).
name: collect-agent tests

on:
  push:
    branches: [collect-agent, 'claude/**']
    paths: ["collect-agent/**", ".github/workflows/collect-agent.yml"]
  pull_request:
    branches: [collect-agent]
    paths: ["collect-agent/**", ".github/workflows/collect-agent.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-agent-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: collect-agent

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        # מנהל 274: ריצה 833 — checkout נתקע 15 דק׳ ובלע את כל ה-timeout של הג׳וב. ⇒ נכשל מהר (3 דק׳).
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: collect-agent/requirements-dev.lock
      - name: התקנה
        # נעילת תלויות: גרסאות + sha256 (requirements-dev.lock, uv --universal 3.11+)
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - name: ruff (כולל כללי אבטחה S)
        run: ruff check .
      - name: צילום העץ לפני pytest (שומר-עץ, כולל קבצים מתעלמים)
        run: python3 -I scripts/tree_guard.py snapshot "$RUNNER_TEMP/tree-before.txt"
      # הפעלה 225 (QA): TMPDIR ייעודי לכל צעדי הבדיקה (pytest, evals, demo.sh, smoke, חוזים, sandbox) + צילום לפני
      # ⇒ fs-check בסוף. ה-basetemp של pytest (pytest-of-*, נשמר בכוונה 3 ריצות) מחוץ לתיקייה הנבדקת.
      - name: TMPDIR ייעודי לצעדי הבדיקה + צילום לפני
        run: |
          mkdir -p "$RUNNER_TEMP/test-tmp"
          echo "TMPDIR=$RUNNER_TEMP/test-tmp" >> "$GITHUB_ENV"
          python3 -I scripts/tree_guard.py fs-snapshot "$RUNNER_TEMP/test-tmp-before.txt" "$RUNNER_TEMP/test-tmp"
      - name: pytest (יחידה + אבטחה + E2E + סימולציית 60 יום)
        run: python -m pytest -q --basetemp="$RUNNER_TEMP/pytest-base"
      - name: שומר-עץ — הבדיקות לא השאירו קבצים בפרויקט (.venv/sqlite/demo-output…)
        run: python3 -I scripts/tree_guard.py check "$RUNNER_TEMP/tree-before.txt"
      - name: evals של מנוע השיחה (315 מקרים, נכשל על הפרת מעקה)
        run: python -m evals.harness
      - name: רצפי רגרסיה רב-הודעתיים דרך svc.inbound (evals/seq/, כולל מעבר SMS⇄מייל) — נכשל על כל רצף
        run: python -m evals.sequences
      - name: הדגמה מקצה לקצה (שרת + נתוני דמו + דשבורד, dry-run)
        run: ./demo.sh --check
      - name: smoke — מעקות השרת (טוקן, 401, docs, webhook 019, DB 0600, אין דליפה ללוג)
        run: bash scripts/smoke_server.sh
      - name: בדיקות חוזה מול mock כשרתי HTTP (חשבונית ירוקה · 019 · InforU) — נכשל על FAIL
        run: bash scripts/contract_checks_http.sh
      - name: יום ראשון של ה-sandbox — כל ענפי ההחלטה מול mock (גבייה סוכן; ששילם לא מקבל תזכורת)
        run: |
          python3 -I scripts/sandbox_day1_paid_check.py --mock paid
          python3 -I scripts/sandbox_day1_paid_check.py --mock clean
          ! python3 -I scripts/sandbox_day1_paid_check.py --mock unlinked
          ! python3 -I scripts/sandbox_day1_paid_check.py --mock no-status
      - name: שומר-עץ — גם evals, demo.sh --check, smoke וחוזים לא השאירו קבצים בפרויקט (QA, הפעלה 217)
        run: python3 -I scripts/tree_guard.py check "$RUNNER_TEMP/tree-before.txt"
      - name: שומר TMPDIR — צעדי הבדיקה לא השאירו קבצים זמניים (חוץ ממטמון node-compile-cache)
        run: python3 -I scripts/tree_guard.py fs-check "$RUNNER_TEMP/test-tmp-before.txt" "$RUNNER_TEMP/test-tmp"

  # שער 5 · SQLCipher (ADR שלב 2, מאחורי DB_ENCRYPTION=sqlcipher). ג'וב נפרד: ה-test למעלה רץ בלי המודול
  # (ההתקנה וברירת המחדל לא משתנות; בדיקות SQLCipher מדלגות שם בנקיות) — כאן הן רצות באמת על 3.11/3.13.
  sqlcipher:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        # מנהל 274: ריצה 833 — checkout נתקע 15 דק׳ ובלע את כל ה-timeout של הג׳וב. ⇒ נכשל מהר (3 דק׳).
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            collect-agent/requirements-dev.lock
            collect-agent/requirements-sqlcipher.lock
      - name: התקנה (dev + sqlcipher, hashes)
        run: |
          pip install --require-hashes -r requirements-dev.lock -r requirements-sqlcipher.lock
          pip install --no-deps -e .
          python -c "import sqlcipher3; print(sqlcipher3.connect(':memory:').execute('PRAGMA cipher_version').fetchone())"
      - name: צילום העץ לפני הבדיקות (שומר-עץ, כולל קבצים מתעלמים — QA הפעלה 218)
        run: python3 -I scripts/tree_guard.py snapshot "$RUNNER_TEMP/tree-before.txt"
      # הפעלה 226 (QA): TMPDIR ייעודי גם כאן (pytest מוצפן, demo.sh ו-smoke מוצפנים, מפתח חד-פעמי) + צילום לפני
      # ⇒ fs-check בסוף. כל ג׳וב שמריץ קוד מכוסה (test · sqlcipher · web). basetemp מחוץ לתיקייה הנבדקת.
      - name: TMPDIR ייעודי לצעדי SQLCipher + צילום לפני
        run: |
          mkdir -p "$RUNNER_TEMP/cipher-tmp"
          echo "TMPDIR=$RUNNER_TEMP/cipher-tmp" >> "$GITHUB_ENV"
          python3 -I scripts/tree_guard.py fs-snapshot "$RUNNER_TEMP/cipher-tmp-before.txt" "$RUNNER_TEMP/cipher-tmp"
      - name: בדיקות SQLCipher אמיתיות (המודול מותקן ⇒ אין skip)
        run: python -m pytest -q -rs --basetemp="$RUNNER_TEMP/pytest-base-cipher" tests/test_db_encryption.py tests/test_backup.py tests/test_wipe.py tests/test_bench_dashboard.py tests/test_dashboard_sent_channels.py tests/test_messages_history_indexes.py tests/test_reminders_batched.py
      - name: pytest מלא (הדגל כבוי — התקנת המודול לבדה לא משנה התנהגות)
        run: python -m pytest -q --basetemp="$RUNNER_TEMP/pytest-base-full"
      - name: שומר-עץ — pytest עם המודול לא השאיר קבצים בפרויקט
        run: python3 -I scripts/tree_guard.py check "$RUNNER_TEMP/tree-before.txt"
      - name: הדגמה מקצה לקצה עם DB_ENCRYPTION=sqlcipher
        run: DB_ENCRYPTION=sqlcipher ./demo.sh --check
      - name: smoke עם DB_ENCRYPTION=sqlcipher (בלי מפתח לא עולה; קובץ השרת מוצפן). מפתח חד-פעמי
        run: DB_ENCRYPTION=sqlcipher COLLECT_MASTER_KEYS="$(python -m app.secretbox)" bash scripts/smoke_server.sh
      - name: שומר-עץ — demo/smoke המוצפנים לא השאירו קבצים (DB מוצפן, מפתח, demo-output) בפרויקט
        run: python3 -I scripts/tree_guard.py check "$RUNNER_TEMP/tree-before.txt"
      - name: שומר TMPDIR — SQLCipher (pytest/demo/smoke מוצפנים) לא השאיר קבצים זמניים (חוץ מ-node-compile-cache)
        run: python3 -I scripts/tree_guard.py fs-check "$RUNNER_TEMP/cipher-tmp-before.txt" "$RUNNER_TEMP/cipher-tmp"

  # הממשק המעוצב (web/): typecheck+build, בדיקות יחידה, e2e מוק (בלי שרת) ו-e2e חי מול שרת DEMO=1 אמיתי (dry-run).
  # ה-e2e החי אוכף: 409/401 רק צפויים ומאומתים, סגירת טיוטת plan_request מול השרת, בלי גלילה רוחבית בדסקטופ/מובייל.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: collect-agent/web
    steps:
      - uses: actions/checkout@v4
        # מנהל 274: ריצה 833 — checkout נתקע 15 דק׳ ובלע את כל ה-timeout של הג׳וב. ⇒ נכשל מהר (3 דק׳).
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: collect-agent/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: collect-agent/pyproject.toml
      - name: התקנת השרת (ל-e2e החי)
        run: |
          pip install --require-hashes -r ../requirements-dev.lock
          pip install --no-deps -e ..
      - name: התקנת הממשק
        run: npm ci --no-audit --no-fund
      - name: בדיקות יחידה (נוסחים מול templates.py, מדיניות, מיפוי API)
        run: npm test
      - name: typecheck + build
        run: npm run build
      # הפעלה 196 (critic סבב 71 💡1): playwright הוא devDependency מדויק ב-package-lock (עם integrity),
      # מותקן ב-npm ci למעלה. בלי npm i -g ובלי npx -y (מחוץ לנעילה). --no-install: הבינארי המקומי בלבד.
      - name: Playwright (מהנעילה, chromium בלבד)
        run: npx --no-install playwright install --with-deps chromium
      - name: לוג השרתים של בדיקות הדפדפן ⇒ תיקיית הצילומים (עולה כ-artifact בכישלון)
        # ההקשר runner לא זמין ב-env ברמת הג'וב (ריצה 479 נפסלה על זה) ⇒ דרך GITHUB_ENV. e2e/lib.mjs srvStdio
        run: echo "E2E_LOG_DIR=$RUNNER_TEMP/shots" >> "$GITHUB_ENV"
      # הפעלה 224 (QA): TMPDIR ייעודי לכל צעדי הדפדפן + צילום לפני ⇒ fs-check אחרי (רואים גם .org.chromium.* / sqlite / סוד TOTP)
      - name: TMPDIR ייעודי לבדיקות הדפדפן + צילום לפני
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-tmp"
          echo "TMPDIR=$RUNNER_TEMP/e2e-tmp" >> "$GITHUB_ENV"
          python3 -I ../scripts/tree_guard.py fs-snapshot "$RUNNER_TEMP/e2e-tmp-before.txt" "$RUNNER_TEMP/e2e-tmp"
      - name: e2e מוק — 6 מסכים, דסקטופ+מובייל, 0 בקשות חיצוניות
        run: mkdir -p "$RUNNER_TEMP/shots" && TZ=Asia/Jerusalem node e2e/shots.mjs "$RUNNER_TEMP/shots"
      - name: נגישות (ת״י 5568 / WCAG 2.1 AA) — 7 דפי שיווק + 3 עמודי לקוח (/p /pay /u, DEMO=1), axe-core מקומי, נכשל על serious/critical
        run: node e2e/a11y.mjs
      - name: e2e חי מול שרת DEMO=1 (dry-run)
        run: TZ=UTC node e2e/live.mjs "$RUNNER_TEMP/shots"
      - name: e2e התראות לבעל העסק (סוף ניסיון) מול DEMO=1
        run: TZ=UTC node e2e/notices.mjs
      - name: "e2e מרשם בקשות עיון/מחיקה (critic 172ב) — קישור מהכרטיס, סגירה רק עם תיעוד, מול DEMO=1"
        run: TZ=UTC node e2e/dsr.mjs "$RUNNER_TEMP/shots"
      - name: e2e ערכת בטא — יום ראשון לכל ענף (מספרה/מוסך/קליניקה/רו״ח) מול gi_mock
        run: TZ=UTC node e2e/beta.mjs
      - name: e2e תסריט ההדגמה של מכירות (sales/demo-script.md, 6 שלבים) מול DEMO=1
        run: TZ=UTC node e2e/sales-demo.mjs
      - name: e2e הדשבורד הפשוט (/ui) — אישור סכום חריג מול DEMO=1
        run: TZ=UTC node e2e/ui.mjs "$RUNNER_TEMP/shots"
      - name: e2e הדשבורד הפשוט (/ui) — אישור רשימת הפתוחות (CSV ⇒ כרטיס ⇒ «כבר שולם»/«עדיין פתוח» ⇒ השרת) מול DEMO=1
        run: TZ=UTC node e2e/ui-openlist.mjs "$RUNNER_TEMP/shots"
      - name: "e2e הדשבורד הפשוט (/ui) — הודעות מלקוחות: ציטוט, עריכה ⇒ אישור, סגירה בלי מענה (critic 95), «הסר» של בעל העסק ⇒ אין תזכורות אחרי (critic 97) מול DEMO=1"
        run: TZ=UTC node e2e/ui-messages.mjs "$RUNNER_TEMP/shots"
      - name: "e2e הדשבורד הפשוט (/ui) — «טעות בשם בחשבונית, תתקנו ואשלם» ⇒ פעולת תיקון-חשבונית בכרטיס, מחלוקת סכום דחופה, מלכודת בלי התראת שווא מול DEMO=1"
        run: TZ=UTC node e2e/ui-invoice-fix.mjs "$RUNNER_TEMP/shots"
      - name: "e2e המסך המעוצב (/app/#/inbox) — פעולת תיקון-חשבונית (SMS+מייל), «השם שלי בחשבונית שגוי» = דחוף+תיקון, מחלוקת סכום בלי תיקון, מלכודת, אישור, מובייל מול DEMO=1"
        run: TZ=UTC node e2e/app-invoice-fix.mjs "$RUNNER_TEMP/shots"
      - name: "e2e המסך המעוצב (/app/) — רשימת הפתוחות: אין תזכורת לפני אישור, «כבר שולם» לא נפתח בייבוא חוזר, מובייל"
        run: TZ=UTC node e2e/app-openlist.mjs "$RUNNER_TEMP/shots"
      - name: e2e — התראת פקיעת לוח החגים (בית+הגדרות, AA, מובייל)
        run: TZ=UTC node e2e/app-holidays.mjs "$RUNNER_TEMP/shots"
      - name: "e2e — ניגודיות AA בדפדפן: כל מסכי /app/, /ui, /p/, /u/ (בהיר+כהה, 390px) ודפי-הנחיתה"
        run: TZ=UTC node e2e/app-contrast.mjs && node e2e/landing-contrast.mjs
      - name: e2e בנייה מחדש אמיתית של תזכורת מול ה-mock של חשבונית ירוקה (בלי יירוט, /ui ו-/app/)
        run: TZ=UTC node e2e/rebuild.mjs "$RUNNER_TEMP/shots"
      - name: e2e CSP — 7 עמודי HTML (/p, /p-404, /ui, /app, /pay, /connect/orbit) בלי הפרות, וסקריפט מוזרק נחסם
        run: TZ=UTC node e2e/csp.mjs
      - name: e2e מצבי הטעינה של /app/ (דסקטופ+מובייל) — שלד לפי מסך, תצוגה מקדימה בטעינה ובכשל, ערוץ בלי הודעה, תזכורת שהוחלפה
        run: TZ=UTC node e2e/preview.mjs "$RUNNER_TEMP/shots"
      - name: שומר TMPDIR — בדיקות הדפדפן לא השאירו קבצים (חוץ ממטמון node-compile-cache)
        if: success()
        run: python3 -I ../scripts/tree_guard.py fs-check "$RUNNER_TEMP/e2e-tmp-before.txt" "$RUNNER_TEMP/e2e-tmp"
      - name: לוג השרתים של בדיקות הדפדפן (רק בכישלון, 200 שורות אחרונות לכל קובץ)
        if: failure()
        run: |
          shopt -s nullglob
          for f in "$E2E_LOG_DIR"/*.log; do echo "=== $f"; tail -n 200 "$f"; done
      - name: צילומים + לוג השרתים (רק בכישלון)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-shots
          path: ${{ runner.temp }}/shots
          retention-days: 7

  # הפעלה 192 — ההדגמה במכונה נקייה: container של הפצה, פייתון של המערכת, בלי setup-python (שמסתיר את
  # באג 191: pip של פייתון אחר + cryptography של debian ⇒ demo.sh נפל). ci_clean_demo.sh מוודא שהמכונה
  # נקייה, ש-demo.sh יצר .venv ועבר, ושריצה שנייה עוברת מה-.venv הקיים. SKIP_WEB=1 (הממשק נבדק בג'וב web).
  demo-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:bookworm", "ubuntu:24.04"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        # מנהל 274: ריצה 833 — checkout נתקע 15 דק׳ ובלע את כל ה-timeout של הג׳וב. ⇒ נכשל מהר (3 דק׳).
        timeout-minutes: 3
        with:
          persist-credentials: false
      - name: ./demo.sh --check במכונה נקייה (פעמיים)
        run: bash scripts/ci_clean_demo.sh

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        # מנהל 274: ריצה 833 — checkout נתקע 15 דק׳ ובלע את כל ה-timeout של הג׳וב. ⇒ נכשל מהר (3 דק׳).
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: התקנה
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: bandit (SAST)
        # קבצי דמו: asserts של תרחיש וטוקנים מזויפים (נטענים רק בהדגמה)
        run: bandit -q -r app scripts -x app/demo.py,app/demo_data.py,scripts/demo_integrations.py
      - name: pip-audit (CVE ידועים בתלויות)
        # הסריקה על הנעילה עצמה (מה שבאמת מותקן), לא על הסביבה
        run: |
          pip-audit --require-hashes -r requirements-dev.lock --progress-spinner off
          pip-audit --require-hashes -r requirements-sqlcipher.lock --progress-spinner off
      - name: סריקת סודות + Trojan Source + רשימת hosts סגורה
        run: python -m pytest -q tests/test_security.py -k "secrets or trojan or gitignore or outbound"
