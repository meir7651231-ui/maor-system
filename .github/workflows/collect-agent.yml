# גבי (collect-agent) — בדיקות + שער אבטחה. רץ רק כשמשהו תחת collect-agent/ משתנה.
# אין כאן deploy, אין סודות, אין רשת חיצונית בבדיקות (socket חסום ב-conftest).
name: collect-agent tests

on:
  push:
    branches: [collect-agent, 'claude/**']
    paths: ["collect-agent/**", ".github/workflows/collect-agent.yml"]
  pull_request:
    branches: [collect-agent]
    paths: ["collect-agent/**", ".github/workflows/collect-agent.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-agent-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: collect-agent

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: collect-agent/requirements-dev.lock
      - name: התקנה
        # נעילת תלויות: גרסאות + sha256 (requirements-dev.lock, uv --universal 3.11+)
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - name: ruff (כולל כללי אבטחה S)
        run: ruff check .
      - name: pytest (יחידה + אבטחה + E2E + סימולציית 60 יום)
        run: python -m pytest -q
      - name: evals של מנוע השיחה (315 מקרים, נכשל על הפרת מעקה)
        run: python -m evals.harness
      - name: הדגמה מקצה לקצה (שרת + נתוני דמו + דשבורד, dry-run)
        run: ./demo.sh --check
      - name: smoke — מעקות השרת (טוקן, 401, docs, webhook 019, DB 0600, אין דליפה ללוג)
        run: bash scripts/smoke_server.sh

  # שער 5 · SQLCipher (ADR שלב 2, מאחורי DB_ENCRYPTION=sqlcipher). ג'וב נפרד: ה-test למעלה רץ בלי המודול
  # (ההתקנה וברירת המחדל לא משתנות; בדיקות SQLCipher מדלגות שם בנקיות) — כאן הן רצות באמת על 3.11/3.13.
  sqlcipher:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            collect-agent/requirements-dev.lock
            collect-agent/requirements-sqlcipher.lock
      - name: התקנה (dev + sqlcipher, hashes)
        run: |
          pip install --require-hashes -r requirements-dev.lock -r requirements-sqlcipher.lock
          pip install --no-deps -e .
          python -c "import sqlcipher3; print(sqlcipher3.connect(':memory:').execute('PRAGMA cipher_version').fetchone())"
      - name: בדיקות SQLCipher אמיתיות (המודול מותקן ⇒ אין skip)
        run: python -m pytest -q -rs tests/test_db_encryption.py tests/test_backup.py tests/test_wipe.py
      - name: pytest מלא (הדגל כבוי — התקנת המודול לבדה לא משנה התנהגות)
        run: python -m pytest -q
      - name: הדגמה מקצה לקצה עם DB_ENCRYPTION=sqlcipher
        run: DB_ENCRYPTION=sqlcipher ./demo.sh --check
      - name: smoke עם DB_ENCRYPTION=sqlcipher (בלי מפתח לא עולה; קובץ השרת מוצפן). מפתח חד-פעמי
        run: DB_ENCRYPTION=sqlcipher COLLECT_MASTER_KEYS="$(python -m app.secretbox)" bash scripts/smoke_server.sh

  # הממשק המעוצב (web/): typecheck+build, בדיקות יחידה, e2e מוק (בלי שרת) ו-e2e חי מול שרת DEMO=1 אמיתי (dry-run).
  # ה-e2e החי אוכף: 409/401 רק צפויים ומאומתים, סגירת טיוטת plan_request מול השרת, בלי גלילה רוחבית בדסקטופ/מובייל.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: collect-agent/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: collect-agent/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: collect-agent/pyproject.toml
      - name: התקנת השרת (ל-e2e החי)
        run: |
          pip install --require-hashes -r ../requirements-dev.lock
          pip install --no-deps -e ..
      - name: התקנת הממשק
        run: npm ci --no-audit --no-fund
      - name: בדיקות יחידה (נוסחים מול templates.py, מדיניות, מיפוי API)
        run: npm test
      - name: typecheck + build
        run: npm run build
      - name: Playwright (גרסה מקובעת, chromium בלבד)
        run: |
          npm i -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
      - name: לוג השרתים של בדיקות הדפדפן ⇒ תיקיית הצילומים (עולה כ-artifact בכישלון)
        # ההקשר runner לא זמין ב-env ברמת הג'וב (ריצה 479 נפסלה על זה) ⇒ דרך GITHUB_ENV. e2e/lib.mjs srvStdio
        run: echo "E2E_LOG_DIR=$RUNNER_TEMP/shots" >> "$GITHUB_ENV"
      - name: e2e מוק — 6 מסכים, דסקטופ+מובייל, 0 בקשות חיצוניות
        run: mkdir -p "$RUNNER_TEMP/shots" && NODE_PATH="$(npm root -g)" TZ=Asia/Jerusalem node e2e/shots.mjs "$RUNNER_TEMP/shots"
      - name: e2e חי מול שרת DEMO=1 (dry-run)
        run: NODE_PATH="$(npm root -g)" TZ=UTC node e2e/live.mjs "$RUNNER_TEMP/shots"
      - name: e2e התראות לבעל העסק (סוף ניסיון) מול DEMO=1
        run: NODE_PATH="$(npm root -g)" TZ=UTC node e2e/notices.mjs
      - name: e2e הדשבורד הפשוט (/ui) — אישור סכום חריג מול DEMO=1
        run: NODE_PATH="$(npm root -g)" TZ=UTC node e2e/ui.mjs "$RUNNER_TEMP/shots"
      - name: e2e בנייה מחדש אמיתית של תזכורת מול ה-mock של חשבונית ירוקה (בלי יירוט, /ui ו-/app/)
        run: NODE_PATH="$(npm root -g)" TZ=UTC node e2e/rebuild.mjs "$RUNNER_TEMP/shots"
      - name: לוג השרתים של בדיקות הדפדפן (רק בכישלון, 200 שורות אחרונות לכל קובץ)
        if: failure()
        run: |
          shopt -s nullglob
          for f in "$E2E_LOG_DIR"/*.log; do echo "=== $f"; tail -n 200 "$f"; done
      - name: צילומים + לוג השרתים (רק בכישלון)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-shots
          path: ${{ runner.temp }}/shots
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: התקנה
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: bandit (SAST)
        # קבצי דמו: asserts של תרחיש וטוקנים מזויפים (נטענים רק בהדגמה)
        run: bandit -q -r app scripts -x app/demo.py,app/demo_data.py,scripts/demo_integrations.py
      - name: pip-audit (CVE ידועים בתלויות)
        # הסריקה על הנעילה עצמה (מה שבאמת מותקן), לא על הסביבה
        run: |
          pip-audit --require-hashes -r requirements-dev.lock --progress-spinner off
          pip-audit --require-hashes -r requirements-sqlcipher.lock --progress-spinner off
      - name: סריקת סודות + Trojan Source + רשימת hosts סגורה
        run: python -m pytest -q tests/test_security.py -k "secrets or trojan or gitignore or outbound"
