# 🌙 סקריפטי-הדפדפן הארוכים (11.11.2026) — 5–17 דק' כל אחד, ולכן לא בכל push:
# נעילת-הדמו (demo-no-export), full-audit (דסקטופ+מובייל), modal-audit, swarm-capture.
# רץ בלילה על main, וידנית על כל ענף (Actions ← e2e nightly ← Run workflow).
name: e2e nightly

on:
  schedule:
    - cron: '17 1 * * *' # 01:17 UTC ≈ 03:17 שעון ישראל
  workflow_dispatch:

jobs:
  e2e-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: e2e (nightly suite)
        run: node e2e/run-ci.mjs --suite=nightly
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-nightly-shots
          path: |
            e2e/shots/
            e2e/shots-audit/
          if-no-files-found: ignore
          retention-days: 7
