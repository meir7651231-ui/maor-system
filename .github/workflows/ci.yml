# CI לענפי עבודה — כל push לענף claude/* עובר את השער המלא.
# (הפריסה ל-Pages נשארת ב-deploy.yml, על main בלבד.)
name: CI

on:
  push:
    branches: ['claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (0 warnings)
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
