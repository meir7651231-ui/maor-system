# CI לענפי עבודה — כל push לענף claude/* עובר את השער המלא.
# (הפריסה ל-Pages נשארת ב-deploy.yml, על main בלבד.)
name: CI

on:
  push:
    branches: ['claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (0 warnings)
        run: npm run lint

      - name: Tests
        run: npm run test

      # 🪞 SELF-V2: הבדיקות המהירות משתמשות בחותמות ובמטמון; כאן — פעם אחת בנייה מלאה של הקטלוג בלי שום מטמון/חותמת
      # (CATALOG_CACHE=off) והשוואה ביט-אחר-ביט לקבצים שבריפו
      - name: Catalog — full no-cache rebuild (bit-identical)
        run: CATALOG_FULL=1 npx vitest run catalog/__tests__/self-v2.test.ts

      # 🏭 המפעל (14.10): מפרק ⇒ מחבר ⇒ מאמת. נכשל אם הקבצים שנוצרו לא מעודכנים או חיבור מאומת נכשל
      - name: Atoms factory (--check)
        run: npm run atoms:factory -- --check

      - name: Build
        run: npm run build

  # 🛡️ ביקורת-האמון 24.8: סוויטת ה-red-team של Firestore Rules הייתה מוגדרת
  # (npm run test:rules) אך לא רצה ב-CI — שינוי-Rules שובר-בידוד היה עובר בשקט.
  # ג'וב נפרד: האמולטור (~1ד') לא מאט את שער-הקוד הראשי.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Firestore Rules red-team (emulator)
        run: npm run test:rules

  # סריקת-תלויות מדווחת (לא-חוסמת בשלב זה — ביקורת-האמון 24.8): מציפה CVEs
  # בלוג-הריצה; החמרה לחוסם = החלטת-בעלים בהמשך.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm audit (report-only)
        run: npm audit --audit-level=high || echo '⚠ נמצאו חולשות ברמת high+ — ראו למעלה'
