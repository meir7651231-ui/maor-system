# 🛡️ ביקורת-האמון 24.8: לא הייתה שום סריקת-תלויות — עדכוני-אבטחה שבועיים כ-PR
# (עוברים את שער-ה-CI המלא כמו כל שינוי; מיזוג = החלטה מפורשת, לא אוטומטי).
#
# 🛡️ הידוק שרשרת-אספקה (cooldown): לא מאמצים גרסת-חבילה טרייה. גרסה זדונית
# (הווקטור מס' 1 בסביבת npm) מתגלה ומורדת תוך שעות-עד-ימים — השהיית 5 ימים
# נותנת חיץ-בטיחות לפני שהעדכון בכלל נפתח כ-PR. (מקביל ל-minimumReleaseAge של pnpm.)
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
  - package-ecosystem: npm
    directory: '/functions'
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 5
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
